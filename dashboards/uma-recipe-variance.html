<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uma Blu · Recipe variance</title>
<style>
  :root {
    --bg: #0f1c24; --bg2: #162833; --line: #2a4554; --text: #eef4f7;
    --muted: #8aa0ad; --accent: #3db8a0; --warn: #e0a045; --danger: #e05a4c;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 1100px; padding: 16px 16px 72px; background: var(--bg); color: var(--text); font-family: var(--font); }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  h1 em { font-style: normal; color: var(--accent); }
  .note { color: var(--muted); font-size: 0.86rem; line-height: 1.4; }
  nav.uma { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  nav.uma a {
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 650;
  }
  nav.uma a.active { color: var(--accent); }
  .banner { background: var(--bg2); border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 10px 12px; }
  details { border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); margin: 8px 0; padding: 0 12px 10px; }
  details summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--accent); }
</style>
</head>
<body>
  <p class="note">WOLF · BZG · Uma Blu · Recipe variance</p>
  <h1>Uma Blu <em>recipe variance</em></h1>
  <p class="note">Theoretical quantities use stored recipe lines and the ESB menu mix. The variance amount stays unknown. Tiles start closed. staff_ready is false.</p>
  <nav class="uma" aria-label="This page">
    <a href="/bzg/uma-blu/recipes">Recipes</a>
    <a class="active" href="/uma/recipe-variance">Variance</a>
  </nav>
  <p class="banner" id="banner">Loading the recipe read…</p>
  <details>
    <summary>Product mix</summary>
    <div id="mix" class="note"></div>
  </details>
  <details>
    <summary>Theoretical</summary>
    <div id="theoretical" class="note"></div>
  </details>
  <details>
    <summary>Variance</summary>
    <div id="variance" class="note"></div>
  </details>
  <script>
    function line(node, text) {
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = text;
      node.appendChild(p);
    }
    fetch("/api/bzg/uma-blu/recipe-variance", { headers: { "Accept": "application/json" } })
      .then((res) => res.json())
      .then((data) => {
        const banner = document.getElementById("banner");
        if (!data || data.ok !== true) {
          banner.textContent = "The recipe read did not load.";
          return;
        }
        const variance = data.variance || {};
        banner.textContent = "Variance " + (variance.state || "UNKNOWN") + " · staff_ready false";
        const mix = data.product_mix || {};
        line(document.getElementById("mix"), (mix.real ? "Readable" : "Not readable") + ". " + (mix.why || ""));
        line(document.getElementById("mix"), "Day " + (mix.day || "UNKNOWN") + " · menus " + String(mix.menu_count));
        const theoretical = data.theoretical || {};
        line(document.getElementById("theoretical"), theoretical.state + ". Matched recipes " + String(theoretical.matched_recipes) + ".");
        line(document.getElementById("variance"), variance.state + ". " + (variance.why || ""));
        const close = data.pack2_close || {};
        line(document.getElementById("variance"), "Pack 2 close " + (close.close_id || "missing") + " is not this variance.");
      })
      .catch(() => {
        document.getElementById("banner").textContent = "The recipe read did not load.";
      });
  </script>
</body>
</html>
