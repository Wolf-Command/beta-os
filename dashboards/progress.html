<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wolf · Progress</title>
<style>
  :root {
    --bg: #101418;
    --bg2: #171d23;
    --bg3: #1f272f;
    --line: #2c3842;
    --text: #eef2f5;
    --muted: #8b9aa6;
    --accent: #c4a574;
    --ok: #5fbf8a;
    --warn: #d4a35c;
    --danger: #d66a5e;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background:
      radial-gradient(ellipse 90% 60% at 0% -10%, #243039 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 100% 0%, #2a241c 0%, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 18px 72px; }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    justify-content: space-between; margin-bottom: 14px;
  }
  .brand {
    font-family: var(--display);
    font-size: 2rem; font-weight: 600; letter-spacing: -0.03em; margin: 0;
  }
  .brand em { font-style: italic; color: var(--accent); font-weight: 500; }
  .sub { color: var(--muted); font-size: 0.92rem; margin: 4px 0 0; max-width: 36rem; line-height: 1.4; }
  .who { font-size: 0.78rem; color: var(--muted); text-align: right; }
  .panel {
    background: color-mix(in srgb, var(--bg2) 94%, #000);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .pct {
    font-family: var(--display);
    font-size: clamp(3rem, 12vw, 3.8rem); line-height: 1; letter-spacing: -0.04em; margin: 0;
  }
  .pct small { font-size: 0.9rem; color: var(--muted); font-family: var(--font); letter-spacing: 0; }
  .phase-line {
    margin: 10px 0 0; font-size: 1.05rem; line-height: 1.35; color: var(--text);
    font-family: var(--display); font-weight: 500;
  }
  .label-est {
    display: inline-block; margin-top: 8px; font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--warn);
    border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
    padding: 4px 8px; border-radius: 6px;
  }
  .chips {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0;
  }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--bg3);
    color: var(--muted); border-radius: 8px; padding: 6px 10px;
    font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em; cursor: help;
  }
  .chip strong { color: var(--text); margin-left: 4px; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .mission {
    border-top: 1px solid var(--line); padding: 12px 0;
  }
  .mission:first-child { border-top: 0; padding-top: 0; }
  .mission .t { font-weight: 650; }
  .mission .n { color: var(--muted); font-size: 0.8rem; margin-top: 3px; line-height: 1.35; }
  .mission .who { color: var(--accent); font-size: 0.72rem; letter-spacing: 0.04em; margin-top: 4px; }
  .empty-ok { color: var(--ok); font-size: 0.88rem; margin: 0; }
  .nav {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px;
  }
  .nav button {
    appearance: none; border: 1px solid var(--line); background: var(--bg3);
    color: var(--muted); border-radius: 999px; padding: 9px 12px;
    font-size: 0.82rem; font-weight: 600; cursor: pointer;
  }
  .nav button.active { color: var(--text); border-color: var(--accent); background: #2a2620; }
  .nav-toggle {
    display: none; width: 100%; margin-bottom: 8px;
    appearance: none; border: 1px solid var(--line); background: var(--bg3);
    color: var(--text); border-radius: 10px; padding: 12px; font-weight: 650;
  }
  @media (max-width: 640px) {
    .nav-toggle { display: block; }
    .nav { display: none; }
    .nav.open { display: flex; }
    .desktop-only { display: none !important; }
  }
  h2 {
    margin: 0 0 10px; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--muted); font-weight: 650;
  }
  .pulse-grid {
    display: grid; grid-template-columns: 1fr; gap: 10px;
  }
  @media (min-width: 720px) {
    .pulse-grid { grid-template-columns: 1fr 1fr; }
  }
  .pulse-block ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
  .pulse-block .factory-tag {
    display: inline-block; margin-top: 4px; font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line);
  }
  .factory-tag.HEALTHY { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .factory-tag.DEGRADED { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .factory-tag.FAILING { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .move {
    border-top: 1px solid var(--line); padding: 12px 0;
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  }
  .move:first-child { border-top: 0; padding-top: 0; }
  .move-cls {
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; color: var(--muted);
    white-space: nowrap;
  }
  .move-cls.ACTIVE { color: var(--ok); }
  .move-cls.WAITING { color: var(--warn); }
  .move-cls.RECOMMENDED { color: var(--accent); }
  .move-cls.APPROVED { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .move .t { font-weight: 650; }
  .move .n { color: var(--muted); font-size: 0.8rem; margin-top: 3px; line-height: 1.35; }
  .win { border-top: 1px solid var(--line); padding: 10px 0; }
  .win:first-child { border-top: 0; padding-top: 0; }
  .win .t { font-weight: 650; }
  .win .e { color: var(--muted); font-size: 0.78rem; margin-top: 3px; }
  .road {
    display: flex; flex-wrap: nowrap; gap: 0; overflow-x: auto; padding-bottom: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .mile {
    flex: 0 0 auto; min-width: 120px; max-width: 150px;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    background: var(--bg3); margin-right: 8px; font-size: 0.78rem;
  }
  .mile.on { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
  .mile.off { opacity: 0.55; }
  .mile .lab { font-weight: 700; margin-bottom: 4px; }
  .mile .st { font-size: 0.68rem; letter-spacing: 0.05em; color: var(--muted); }
  .mile.on .st { color: var(--ok); }
  .dom-grid {
    display: grid; grid-template-columns: 1fr; gap: 10px;
  }
  @media (min-width: 640px) {
    .dom-grid { grid-template-columns: 1fr 1fr; }
  }
  .dom {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg3);
  }
  .dom .n { font-size: 0.82rem; font-weight: 700; }
  .dom .phase { color: var(--muted); font-size: 0.8rem; margin: 4px 0 8px; line-height: 1.35; }
  .bar {
    height: 8px; border-radius: 999px; background: #12171c; overflow: hidden;
    border: 1px solid var(--line);
  }
  .bar > i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #8a7348, var(--accent));
    width: 0%;
  }
  .dom .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .dom .v { font-size: 1.15rem; font-weight: 700; }
  .dom .gap { color: var(--warn); font-size: 0.75rem; margin-top: 8px; line-height: 1.35; }
  .item {
    border-top: 1px solid var(--line); padding: 12px 0;
  }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item .cap { font-weight: 650; }
  .item .meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.35; }
  .pill {
    display: inline-block; font-size: 0.68rem; letter-spacing: 0.04em;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
    color: var(--muted); margin-right: 4px; margin-top: 6px;
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .pill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .stage-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px;
  }
  .stage {
    flex: 1 1 90px; min-width: 90px;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px;
    background: var(--bg3); font-size: 0.75rem;
  }
  .stage strong { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 2px; }
  details.calc, details.disclose {
    margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    background: var(--bg2);
  }
  details.calc summary, details.disclose summary {
    cursor: pointer; font-weight: 650; color: var(--accent);
  }
  details.calc ol { margin: 10px 0 0; padding-left: 1.2rem; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
  .gate {
    border: 1px solid color-mix(in srgb, var(--danger) 50%, var(--line));
    background: #2a1816; border-radius: 14px; padding: 24px; text-align: center;
  }
  .gate h1 { font-family: var(--display); margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
  .why {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    border: 1px dashed color-mix(in srgb, var(--warn) 50%, var(--line));
    color: var(--warn); font-size: 0.85rem; line-height: 1.4;
  }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  a.back:hover { text-decoration: underline; }
  .locked { opacity: 0.55; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .mobile-next { display: none; }
  @media (max-width: 640px) {
    .mobile-next { display: block; }
  }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="muted">Loading progress…</p>
  </div>
<script>
(function () {
  const app = document.getElementById("app");
  let model = null;
  let view = "Empire";

  async function api(path) {
    const res = await fetch(path, { credentials: "same-origin", headers: { Accept: "application/json" } });
    const data = await res.json().catch(() => ({}));
    return { status: res.status, data };
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function pillLifecycle(lc) {
    const u = String(lc || "").toUpperCase();
    let cls = "";
    if (u === "LIVE" || u === "VERIFIED") cls = "ok";
    else if (u === "TESTED" || u === "BETA" || u === "BUILT" || u === "WRITE_LOCKED" || u === "READ_ONLY") cls = "warn";
    else if (u === "SPECIFIED" || u === "IDEA" || u === "NOT_TARGET") cls = "";
    else cls = "warn";
    return `<span class="pill ${cls}">${esc(u || "?")}</span>`;
  }

  function pillFlags(it) {
    const bits = [];
    bits.push(it.built ? `<span class="pill warn">BUILT</span>` : `<span class="pill">NOT BUILT</span>`);
    bits.push(it.commissioned ? `<span class="pill ok">COMMISSIONED</span>` : `<span class="pill">NOT COMMISSIONED</span>`);
    bits.push(it.live ? `<span class="pill ok">LIVE</span>` : `<span class="pill">NOT LIVE</span>`);
    if (it.waiting_class) bits.push(`<span class="pill warn">${esc(it.waiting_class)}</span>`);
    if (it.confidence) bits.push(`<span class="pill">${esc(it.confidence)}</span>`);
    return bits.join(" ");
  }

  function renderStages(stages) {
    if (!stages || !stages.length) return "";
    return `<div class="stage-row">${stages.map((s) => `
      <div class="stage"><strong>${esc(s.label || s.id)}</strong>${esc(s.state)}${s.note ? `<div class="muted" style="margin-top:4px">${esc(s.note)}</div>` : ""}</div>
    `).join("")}</div>`;
  }

  function renderItems(items, limit) {
    const list = (items || []).slice(0, limit || 40);
    if (!list.length) return `<p class="muted">No items in this view.</p>`;
    return list.map((it) => `
      <div class="item">
        <div class="cap">${esc(it.capability || it.id)}</div>
        <div class="meta">${esc(it.domain || "")}${it.source ? ` · ${esc(it.source)}` : ""}</div>
        <details class="disclose" style="margin-top:8px;padding:8px 10px">
          <summary>DETAILS</summary>
          <div class="meta" style="margin-top:6px">ID ${esc(it.id || "")}${it.master_build_id ? ` · ${esc(it.master_build_id)}` : ""}</div>
          <div>${pillLifecycle(it.lifecycle)} ${pillFlags(it)}</div>
        </details>
        ${it.target_profit_note ? `<div class="meta" style="color:var(--warn)">${esc(it.target_profit_note)}</div>` : ""}
      </div>
    `).join("");
  }

  function bar(pct) {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    return `<div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div>`;
  }

  function renderEmpire() {
    const v = (model.views || {}).Empire || {};
    const overall = model.overall || {};
    const phase = v.owner_phase || model.owner_phase || "";
    const chips = v.status_chips || model.status_chips || [];
    const pulse = v.owner_pulse || model.owner_pulse || {};
    const moves = v.next_moves || model.next_moves || [];
    const wins = v.recent_wins || model.recent_wins || [];
    const road = v.milestone_road || model.milestone_road || [];
    const domains = v.domains || model.domains || {};
    const fh = (v.factory_health || model.factory_health || {});
    const tech = v.technical_details || {};
    const needsYou = v.needs_you || model.needs_you || [];
    const waitingOthers = v.waiting_on_others || model.waiting_on_others || [];
    const policies = v.policy_decisions || model.policy_decisions || [];

    const heroChips = chips.filter((c) => c.id !== "COMMISSIONED");
    const firstMove = moves[0];

    function renderMissionCards(list, emptyMsg) {
      if (!list.length) return `<p class="empty-ok">${esc(emptyMsg)}</p>`;
      return list.map((m) => `
        <div class="mission">
          <span class="move-cls ${esc(m.status || "WAITING")}">${esc(m.status || m.bucket || "")}</span>
          <div class="t" style="display:inline;margin-left:8px">${esc(m.title || "")}</div>
          ${m.who ? `<div class="who">${esc(m.who)}</div>` : ""}
          ${m.note ? `<div class="n">${esc(m.note)}</div>` : ""}
        </div>
      `).join("");
    }

    function renderPolicyCards(list) {
      if (!list.length) return `<p class="empty-ok">No open policy decisions curated.</p>`;
      return list.map((p) => `
        <div class="mission">
          <span class="move-cls RECOMMENDED">POLICY</span>
          <div class="t" style="display:inline;margin-left:8px">${esc(p.title || "")}</div>
          ${p.note ? `<div class="n">${esc(p.note)}</div>` : ""}
        </div>
      `).join("");
    }

    return `
      <div class="stack">
        <div class="panel">
          <h2>How far are we?</h2>
          <p class="pct">${esc(overall.overall_pct)}%<small> / 100</small></p>
          <span class="label-est">${esc(overall.label || "PARTIAL ESTIMATE")}</span>
          <p class="phase-line">${esc(phase)}</p>
          <div class="chips" aria-label="Status vocabulary">
            ${heroChips.map((c) => `
              <span class="chip" title="${esc(c.tooltip || "")}">${esc(c.label)}</span>
            `).join("")}
          </div>
          <p class="muted" style="margin:10px 0 0">Vocabulary only — categories overlap. Counts and builder honesty live under How calculated.</p>
        </div>

        ${firstMove ? `
        <div class="panel mobile-next">
          <h2>Next move</h2>
          <div class="move" style="border:0;padding:0">
            <span class="move-cls ${esc(firstMove.class)}">${esc(firstMove.class)}</span>
            <div>
              <div class="t">${esc(firstMove.text)}</div>
              ${firstMove.note ? `<div class="n">${esc(firstMove.note)}</div>` : ""}
            </div>
          </div>
        </div>` : ""}

        <div class="panel">
          <h2>Needs you</h2>
          ${renderMissionCards(needsYou, "Nothing needs you right now — success (except active Progress retest while iterating).")}
        </div>
        <div class="panel">
          <h2>Waiting on others</h2>
          ${renderMissionCards(waitingOthers, "No curated waiting-on-others missions.")}
        </div>
        <div class="panel">
          <h2>Policy decisions</h2>
          ${renderPolicyCards(policies)}
        </div>

        <div class="panel">
          <h2>Owner pulse</h2>
          <div class="pulse-grid">
            <div class="pulse-block">
              <div class="n" style="font-weight:700;margin-bottom:4px">Working now</div>
              <ul>${(pulse.working_now || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>—</li>"}</ul>
            </div>
            <div class="pulse-block">
              <div class="n" style="font-weight:700;margin-bottom:4px">Waiting on people</div>
              <ul>${(pulse.waiting_on_people || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>—</li>"}</ul>
            </div>
            <div class="pulse-block">
              <div class="n" style="font-weight:700;margin-bottom:4px">Policy · data needed</div>
              <ul>${(pulse.policy_data_needed || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li class='muted'>—</li>"}</ul>
            </div>
            <div class="pulse-block">
              <div class="n" style="font-weight:700;margin-bottom:4px">Build system</div>
              <div>
                <span class="factory-tag ${esc((pulse.build_system || {}).factory || fh.status || "HEALTHY")}">Factory ${(pulse.build_system || {}).factory || fh.status || "?"}</span>
                <span class="factory-tag HEALTHY" style="margin-left:6px">Production UNTOUCHED</span>
              </div>
              <p class="muted" style="margin:8px 0 0">Factory is system health — not mission completion.</p>
            </div>
          </div>
        </div>

        <div class="panel desktop-only">
          <h2>Next 3 moves</h2>
          ${moves.length ? moves.map((m) => `
            <div class="move">
              <span class="move-cls ${esc(m.class)}">${esc(m.class)}</span>
              <div>
                <div class="t">${esc(m.text)}</div>
                ${m.note ? `<div class="n">${esc(m.note)}</div>` : ""}
              </div>
            </div>
          `).join("") : `<p class="muted">No moves curated yet.</p>`}
          <p class="muted" style="margin:8px 0 0">RECOMMENDED ≠ APPROVED. WAITING ≠ BLOCKED.</p>
        </div>

        <div class="panel">
          <h2>Recent wins</h2>
          ${wins.length ? wins.map((w) => `
            <div class="win">
              <div class="t">${esc(w.text)}</div>
              ${w.evidence ? `<div class="e">Evidence: ${esc(w.evidence)}</div>` : ""}
            </div>
          `).join("") : `<p class="muted">No evidence-backed wins listed.</p>`}
        </div>

        <div class="panel">
          <h2>Milestone road</h2>
          <div class="road">
            ${road.map((m) => `
              <div class="mile ${m.unlocked ? "on" : "off"}">
                <div class="lab">${esc(m.label)}</div>
                <div class="st">${m.unlocked ? "UNLOCKED" : "LOCKED"}</div>
                <div class="muted" style="margin-top:6px;font-size:0.72rem">${esc(m.reason || "")}</div>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="panel">
          <h2>Domains</h2>
          <p class="muted" style="margin-top:0">Weights only in How calculated · ESTIMATED. Bars are visual maturity of tracked items.</p>
          <div class="dom-grid">
            ${Object.keys(domains).map((d) => {
              const x = domains[d];
              return `<div class="dom">
                <div class="n">${esc(d)}</div>
                <div class="phase">${esc(x.plain_phase || "")}</div>
                ${bar(x.visual_pct != null ? x.visual_pct : x.pct)}
                <div class="row"><span class="v">${esc(x.visual_pct != null ? x.visual_pct : x.pct)}%</span><span class="muted" style="font-size:0.72rem">PARTIAL ESTIMATE</span></div>
                <div class="gap">Biggest gap: ${esc(x.biggest_gap || "—")}</div>
                ${x.denominator_note ? `<div class="muted" style="margin-top:6px;font-size:0.72rem">${esc(x.denominator_note)}</div>` : ""}
              </div>`;
            }).join("")}
          </div>
        </div>

        <div class="panel">
          <h2>Habitat · owner stages</h2>
          ${renderStages((v.habitat_owner || {}).stages)}
          <p class="muted">${((v.habitat_owner || {}).distinctions_plain || []).map(esc).join(" · ")}</p>
        </div>
        <div class="panel">
          <h2>Uma Blu · owner stages</h2>
          ${renderStages((v.uma_owner || {}).stages)}
          <p class="muted">${esc((v.uma_owner || {}).waiting_plain || "")} · ${esc((v.uma_owner || {}).variance_plain || "")}</p>
        </div>

        <details class="disclose">
          <summary>DETAILS · SOURCE · technical IDs · why vs prior</summary>
          <p class="muted">Raw capability rows with IDs (PERS-/EVR-/ROLE-/GPO- kept here, not in Owner fields).</p>
          ${((tech.reconcile || model.reconcile || {}).show_why) ? `<div class="why"><strong>Why vs prior ~${esc((tech.reconcile || model.reconcile).prior_pct)}%:</strong> ${esc((tech.reconcile || model.reconcile).why)}</div>` : ""}
          <p class="muted" style="margin-top:8px">progress_type: ${(tech.honesty || {}).progress_type || "PARTIAL_ESTIMATE"} · CSV staleness: ${(tech.honesty || {}).master_build_csv_staleness || "KNOWN"} · overlay required: YES</p>
          ${renderItems(tech.items || [], 30)}
        </details>
      </div>
    `;
  }

  function renderViewBody() {
    const v = (model.views || {})[view] || {};
    if (view === "Empire") return renderEmpire();
    if (view === "Build Factory") {
      const fh = v.factory_health || model.factory_health || {};
      const checks = fh.checks || {};
      return `
        <div class="panel">
          <h2>Build Factory · system health</h2>
          <p class="muted" style="margin-top:0">${esc(v.note || "Excluded from mission weighted %.")}</p>
          <span class="factory-tag ${esc(fh.status || "")}">${esc(fh.status || "?")}</span>
          <span class="factory-tag HEALTHY" style="margin-left:6px">Production ${esc(fh.production || "UNTOUCHED")}</span>
          <div style="margin-top:12px">
            ${Object.keys(checks).map((k) => {
              const c = checks[k];
              return `<div class="item"><div class="cap">${esc(k)}</div><div class="meta">${esc(c.result)} · ${esc(c.detail || "")}</div></div>`;
            }).join("")}
          </div>
        </div>
        <div class="panel" style="margin-top:12px"><h2>Factory runs</h2>${renderItems(v.items, 40)}</div>
      `;
    }
    if (view === "GGV") {
      return `
        <div class="panel">
          <h2>Habitat · PLAN → LEARN</h2>
          ${renderStages((v.habitat_owner || {}).stages)}
          <p class="muted">Write LOCKED on Metricool. BUILT ≠ COMMISSIONED ≠ LIVE.</p>
          ${v.visual_pct != null ? `${bar(v.visual_pct)}<p class="muted">${esc(v.plain_phase || "")} · ${esc(v.pct)}%</p>` : ""}
          ${v.biggest_gap ? `<p class="muted" style="color:var(--warn)">Biggest gap: ${esc(v.biggest_gap)}</p>` : ""}
        </div>
        <div class="panel" style="margin-top:12px"><h2>GGV capabilities</h2>${renderItems(v.items)}</div>
      `;
    }
    if (view === "BZG") {
      return `
        <div class="panel">
          <h2>Uma Close · ESB DATA → VERIFIED CLOSE</h2>
          ${renderStages((v.uma_owner || {}).stages)}
          <p class="muted">${esc((v.uma_owner || {}).waiting_plain || (v.uma_close || {}).waiting || "")} · ${esc((v.uma_owner || {}).variance_plain || "")}</p>
          <p class="muted">WAITING_FOR_CLOSER · WRITE_LOCKED paths remain honest. BUILT ≠ COMMISSIONED ≠ LIVE.</p>
        </div>
        <div class="panel" style="margin-top:12px"><h2>BZG capabilities</h2>${renderItems(v.items)}</div>
      `;
    }
    if (view === "Sale Readiness") {
      return `
        <div class="panel">
          <p class="muted" style="margin-top:0">TARGET profit ≠ ACTUAL — <strong style="color:var(--warn)">ACTUAL NOT YET TRUSTWORTHY</strong></p>
          ${renderItems(v.items, 60)}
        </div>
      `;
    }
    if (view === "Backlog") {
      return `<div class="panel"><p class="muted" style="margin-top:0">${esc(v.note || "")}</p>${renderItems(v.items, 40)}</div>`;
    }
    if (view === "Wolf Core") {
      return `<div class="panel">
        <h2>Wolf Core</h2>
        ${v.denominator_note ? `<p class="muted" style="margin-top:0">${esc(v.denominator_note)}</p>` : ""}
        ${v.visual_pct != null ? `${bar(v.visual_pct)}<p class="muted">${esc(v.plain_phase || "")} · ${esc(v.pct)}% · ESTIMATED</p>` : ""}
        ${v.biggest_gap ? `<p class="muted" style="color:var(--warn)">Biggest gap: ${esc(v.biggest_gap)}</p>` : ""}
        ${renderItems(v.items, 50)}
      </div>`;
    }
    return `<div class="panel"><h2>${esc(view)}</h2>${v.pct != null ? `<p class="muted">Domain estimate ${esc(v.pct)}% · ESTIMATED</p>` : ""}${v.plain_phase ? `<p class="muted">${esc(v.plain_phase)}</p>` : ""}${renderItems(v.items, 50)}</div>`;
  }

  function render() {
    const calc = model.calculation || {};
    const fh = model.factory_health || {};
    app.innerHTML = `
      <header>
        <div>
          <p style="margin:0 0 6px"><a class="back" href="/content-2.0.html">← Content Engine</a></p>
          <h1 class="brand">Wolf <em>Progress</em></h1>
          <p class="sub">Owner cockpit. BUILT ≠ COMMISSIONED ≠ LIVE. Factory health separate. No fake precision.</p>
        </div>
        <div class="who" id="who">Owner surface</div>
      </header>
      <button type="button" class="nav-toggle" id="navToggle">Menu · ${esc(view)}</button>
      <nav class="nav" id="nav" aria-label="Progress views">
        ${(model.menu || []).map((m) => `<button type="button" data-view="${esc(m)}" class="${m === view ? "active" : ""}">${esc(m)}</button>`).join("")}
      </nav>
      <div id="body">${renderViewBody()}</div>
      <details class="calc">
        <summary>HOW CALCULATED · How is this calculated?</summary>
        <ol>${(calc.steps || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
        <p class="muted" style="margin-top:10px">BUILT ≠ HUMAN_COMMISSIONED ≠ LIVE</p>
      </details>
      <details class="disclose">
        <summary>BUILD FACTORY · status ${esc(fh.status || "")}</summary>
        <p class="muted">${esc(fh.note || "")}</p>
        <p class="muted">Production: UNTOUCHED · Excluded from mission %</p>
      </details>
      <details class="disclose">
        <summary>MANDATORY DISTINCTIONS</summary>
        <p class="muted">BUILT ≠ HUMAN_COMMISSIONED ≠ LIVE</p>
        <p class="muted">WAITING_HUMAN ≠ BLOCKED_SYSTEM ≠ UNAPPROVED_POLICY ≠ INACCESSIBLE_SOURCE</p>
        <p class="muted">TARGET ≠ ACTUAL — ACTUAL NOT YET TRUSTWORTHY</p>
        <p class="muted">Weights and % labelled ESTIMATED · Factory HEALTHY ≠ mission complete</p>
      </details>
    `;
    const nav = document.getElementById("nav");
    const toggle = document.getElementById("navToggle");
    toggle.addEventListener("click", () => nav.classList.toggle("open"));
    nav.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        view = btn.getAttribute("data-view");
        render();
      });
    });
  }

  async function boot() {
    const me = await api("/api/core/me");
    if (me.status === 403 || !me.data.ok) {
      app.innerHTML = `<div class="gate"><h1>403</h1><p class="muted">Progress is Owner-only. Sign in as PERS-MATT.</p></div>`;
      return;
    }
    const person = me.data.person_id;
    const prog = await api("/api/progress");
    if (prog.status === 403 || !prog.data.ok) {
      app.innerHTML = `<div class="gate"><h1>403</h1><p class="muted">${esc(prog.data.message || "Staff seats cannot open Progress.")}</p><p class="muted">Resolved person: ${esc(person || "none")}</p></div>`;
      return;
    }
    model = prog.data;
    view = model.default_view || "Empire";
    render();
    const who = document.getElementById("who");
    if (who) who.textContent = `${person || "?"} · ${me.data.email || ""}`;
  }

  boot().catch((err) => {
    app.innerHTML = `<div class="gate"><h1>Unavailable</h1><p class="muted">${esc(err.message || err)}</p></div>`;
  });
})();
</script>
</body>
</html>
