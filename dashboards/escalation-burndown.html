<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wolf · Escalation burn-down</title>
<style>
  :root {
    --bg: #101418;
    --bg2: #171d23;
    --line: #2c3842;
    --text: #eef2f5;
    --muted: #8b9aa6;
    --accent: #c4a574;
    --warn: #d4a35c;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background:
      radial-gradient(ellipse 90% 60% at 0% -10%, #243039 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-family: var(--display); font-weight: 500; font-size: 32px; margin: 0 0 6px; }
  h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px; }
  p { line-height: 1.45; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  .banner {
    border: 1px solid var(--line);
    background: var(--bg2);
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    margin: 12px 0 8px;
  }
  .banner.err { border-left-color: var(--warn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card {
    border: 1px solid var(--line);
    background: var(--bg2);
    padding: 14px;
    margin: 0;
  }
  .k { color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .v { font-family: var(--display); font-size: 28px; margin: 4px 0; }
  .note { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Escalation burn-down</h1>
  <p class="lede">CAP-CORE-12 is already built. This page does not promote it and does not clear Needs Matt. Empty is not independence.</p>
  <div id="banner" class="banner">Reading the counters…</div>
  <h2>Open Needs Matt</h2>
  <div id="open" class="card"></div>
  <h2>Windows</h2>
  <div id="windows" class="grid"></div>
</div>
<script>
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function num(value) {
  return value == null ? "not read" : String(value);
}

function windowCard(row) {
  return '<article class="card"><div class="k">' + esc(row.days) + ' days</div>' +
    '<div class="v">' + esc(row.independence || "NOT_READ") + '</div>' +
    '<p>Opened ' + esc(num(row.opened)) +
    ' · still open ' + esc(num(row.still_open)) +
    ' · older open ' + esc(num(row.older_open)) +
    ' · burned down ' + esc(num(row.burned_down)) +
    ' · refused clear ' + esc(num(row.refused_silent_clear)) +
    ' · time-bounded ' + esc(num(row.intentional_time_bounded)) + '.</p>' +
    '<p class="note">' + esc(row.why || "") + '</p></article>';
}

fetch("/api/core/escalation-burndown", { headers: { "Accept": "application/json" } })
  .then(function (res) {
    return res.json().then(function (body) { return { status: res.status, body: body }; });
  })
  .then(function (pack) {
    const body = pack.body || {};
    const banner = document.getElementById("banner");
    if (!body.ok) {
      banner.className = "banner err";
      banner.textContent = body.message || body.error || "Read failed. No count was invented.";
      return;
    }
    const h = body.honesty || {};
    const maturity = h.ledger_maturity || "UNKNOWN";
    banner.textContent = "CAP-CORE-12 ledger " + maturity +
      ". Not promoted. " + (h.cr_id || "") + " " + (h.cr_state || "unread") +
      ". Needs Matt is not auto-cleared. Writes refused.";
    document.getElementById("open").innerHTML =
      '<div class="k">unresolved Needs Matt</div><div class="v">' +
      esc(num(body.needs_matt_open)) + '</div>' +
      '<p class="note">Undated or future ' + esc(num(body.undated_or_future)) +
      '. Unbounded delegations ' + esc(num(body.unbounded_delegations)) +
      '. This is not an operating independence test.</p>';
    const rows = body.windows || [];
    document.getElementById("windows").innerHTML = rows.map(windowCard).join("");
  })
  .catch(function () {
    const banner = document.getElementById("banner");
    banner.className = "banner err";
    banner.textContent = "Read failed. No count was invented.";
  });
</script>
</body>
</html>
