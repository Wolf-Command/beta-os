<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finance</title>
</head>
<body>
<p>Opening Finance…</p>
<script>
(function () {
  var prefer = "";
  try {
    prefer = localStorage.getItem("wolf.finance.entity") || "";
  } catch (_err) {
    prefer = "";
  }
  var target = prefer
    ? "/finance?entity=" + encodeURIComponent(prefer)
    : "/finance?pick=1";
  location.replace(target);
})();
</script>
</body>
</html>
