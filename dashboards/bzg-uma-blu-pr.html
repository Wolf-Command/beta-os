<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uma Blu · Purchase</title>
<style>
  :root {
    --bg: #0f1c24; --bg2: #162833; --bg3: #1e3542; --line: #2a4554;
    --text: #eef4f7; --muted: #8aa0ad; --accent: #3db8a0; --warn: #e0a045;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body {
    padding: 16px 16px 72px; max-width: 480px; margin: 0 auto;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .brand { font-size: 1.45rem; font-weight: 700; margin: 0 0 4px; }
  .brand em { font-style: normal; color: var(--accent); }
  .sub, .muted { color: var(--muted); font-size: 0.86rem; line-height: 1.4; }
  nav.uma { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  nav.uma a {
    min-height: 44px; display: inline-flex; align-items: center;
    padding: 10px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); text-decoration: none; font-size: 0.84rem; font-weight: 650;
  }
  .panel {
    background: color-mix(in srgb, var(--bg2) 92%, #000);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .chip {
    display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid rgba(61,184,160,0.45); color: var(--accent);
    font-size: 0.72rem; font-weight: 650;
  }
  .line { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .line:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 8px 0 4px; }
  input {
    width: 100%; border: 1px solid var(--line); background: var(--bg3); color: var(--text);
    border-radius: 10px; padding: 12px; font: inherit; font-size: 1.05rem;
  }
  .btn {
    appearance: none; width: 100%; min-height: 44px; margin-top: 10px;
    border-radius: 12px; border: 1px solid #2a8a76; background: #1f6b5c; color: #fff;
    font-size: 1rem; font-weight: 650;
  }
  .btn:disabled { opacity: 0.4; }
  .err { color: #e05a4c; }
</style>
</head>
<body>
  <p class="muted"><a href="/bzg/uma-blu/bills" style="color:var(--muted)">Bills</a></p>
  <h1 class="brand">Purchase <em>detail</em></h1>
  <p class="sub">Existing records stay as recorded. Wolf does not mark them verified.</p>
  <nav class="uma" aria-label="Uma Blu day">
    <a href="/bzg/uma-blu">Today</a>
    <a href="/uma-blu-close">Daily Close</a>
    <a href="/bzg/uma-blu/issues">Issues</a>
    <a href="/bzg/uma-blu/bills">Bills</a>
    <a href="/bzg/uma-blu/bills#purchasing">Purchasing</a>
    <a href="/bzg/uma-blu/evidence">Evidence</a>
    <a href="/bzg/uma-blu/exceptions">Exceptions</a>
    <a href="/my-work">My Work</a>
    <a href="/bzg/uma-blu/petty">Petty cash</a>
  </nav>
  <div id="body"><p class="muted">Loading…</p></div>
<script>
(function () {
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function keyFromLocation() {
    var q = new URLSearchParams(location.search).get("pr");
    if (q) return q;
    var parts = location.pathname.split("/").filter(Boolean);
    return decodeURIComponent(parts[parts.length - 1] || "");
  }
  function field(panel, label, value) {
    if (value == null || value === "") return;
    panel.appendChild(el("div", "muted", label + ": " + value));
  }
  var key = keyFromLocation();
  if (!key || key === "bills") {
    document.getElementById("body").textContent = "No purchase selected.";
    return;
  }
  fetch("/api/bzg/uma-blu/prs/" + encodeURIComponent(key) + "/operator")
    .then(function (r) {
      if (r.status === 404) {
        return fetch("/api/bzg/uma-blu/prs/" + encodeURIComponent(key)).then(function (r2) { return r2.json(); });
      }
      return r.json();
    })
    .then(function (data) {
      var box = document.getElementById("body");
      box.innerHTML = "";
      if (!data.ok || !data.pr) {
        box.appendChild(el("p", "err", (data && data.message) || "Purchase request not found."));
        return;
      }
      var p = data.pr;
      var actions = data.actions || {};
      var head = el("div", "panel");
      var title = el("h2", null, p.supplier_name || "Purchase");
      title.style.margin = "0 0 8px";
      head.appendChild(title);
      if (p.chip === "Existing" || p.legacy) head.appendChild(el("span", "chip", "Existing"));
      field(head, "Number", p.pr_num);
      field(head, "Supplier", p.supplier_name);
      field(head, "Department", p.department);
      field(head, "Requested by", p.requester_label);
      field(head, "Date", p.requested_date);
      field(head, "Status", p.display_status || p.alchemist_status || p.state);
      if (p.expected_value != null) field(head, "Recorded total", String(p.expected_value));
      if (p.source_status_note) head.appendChild(el("p", "muted", p.source_status_note));
      box.appendChild(head);

      var lines = p.lines || [];
      var linePanel = el("div", "panel");
      linePanel.appendChild(el("h2", null, "Lines"));
      if (!lines.length) {
        linePanel.appendChild(el("p", "muted", "No order lines stored."));
      }
      lines.forEach(function (ln) {
        var row = el("div", "line");
        row.appendChild(el("strong", null, ln.item || "Line"));
        if (ln.qty != null) row.appendChild(el("div", "muted", "Qty " + ln.qty + (ln.unit ? " " + ln.unit : "")));
        if (ln.source_received_qty != null) {
          row.appendChild(el("div", "muted", "Existing record received " + ln.source_received_qty + " — not Wolf-verified"));
        }
        if (ln.wolf_received_qty != null) row.appendChild(el("div", "muted", "Wolf received " + ln.wolf_received_qty));
        if (ln.wolf_outstanding_qty != null) row.appendChild(el("div", "muted", "Still to receive " + ln.wolf_outstanding_qty));
        if (ln.price != null) row.appendChild(el("div", "muted", "Price " + ln.price));
        linePanel.appendChild(row);
      });
      box.appendChild(linePanel);

      var act = el("div", "panel");
      act.appendChild(el("h2", null, "Actions"));
      act.appendChild(el("p", "muted", actions.payment_waiting || "Waiting on finance — this screen does not execute payment."));
      function postAction(path, payload, msg, btn) {
        btn.disabled = true;
        fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload || {})
        }).then(function (r) { return r.json(); }).then(function (out) {
          btn.disabled = false;
          if (!out.ok) {
            msg.className = "err";
            msg.textContent = out.error || out.message || "That step was not recorded.";
            return;
          }
          location.reload();
        }).catch(function () {
          btn.disabled = false;
          msg.className = "err";
          msg.textContent = "That step was not recorded.";
        });
      }
      var msg = el("p", "muted", "");
      var state = p.state || p.wolf_state || "";
      if (state === "DRAFT" && actions.submit) {
        var submitBtn = el("button", "btn", "Submit request");
        submitBtn.type = "button";
        submitBtn.onclick = function () { postAction("/api/bzg/uma-blu/prs/" + encodeURIComponent(key) + "/submit", {}, msg, submitBtn); };
        act.appendChild(submitBtn);
      } else if (state === "DRAFT") {
        act.appendChild(el("p", "muted", actions.submit_waiting || "Waiting on staff — no action needed from you."));
      }
      if (state === "REQUESTED" && actions.approve_ops) {
        var approveBtn = el("button", "btn", "Approve request");
        approveBtn.type = "button";
        approveBtn.onclick = function () { postAction("/api/bzg/uma-blu/prs/" + encodeURIComponent(key) + "/approve", {}, msg, approveBtn); };
        act.appendChild(approveBtn);
      } else if (state === "REQUESTED") {
        act.appendChild(el("p", "muted", actions.approve_waiting || "Waiting on approver — no action needed from you."));
      }
      if (state === "APPROVED" && actions.order) {
        var orderBtn = el("button", "btn", "Mark ordered");
        orderBtn.type = "button";
        orderBtn.onclick = function () { postAction("/api/bzg/uma-blu/prs/" + encodeURIComponent(key) + "/order", {}, msg, orderBtn); };
        act.appendChild(orderBtn);
      }
      if (actions.receive && (state === "ORDERED" || state === "PARTIALLY_RECEIVED" || p.legacy)) {
        var form = el("form");
        lines.filter(function (ln) { return ln.interpretable && (ln.wolf_outstanding_qty == null || ln.wolf_outstanding_qty > 0); }).forEach(function (ln) {
          var lab = el("label", null, (ln.item || "Line") + " received now");
          var input = el("input");
          input.type = "number";
          input.min = "0";
          input.step = "any";
          input.setAttribute("data-line", ln.source_line_id);
          form.appendChild(lab);
          form.appendChild(input);
        });
        var noteLab = el("label", null, "Note id or photo id");
        var noteInput = el("input");
        noteInput.id = "evidence-note";
        noteInput.placeholder = "Photo or note id";
        form.appendChild(noteLab);
        form.appendChild(noteInput);
        var btn = el("button", "btn", "Receive goods");
        btn.type = "submit";
        form.appendChild(btn);
        form.appendChild(msg);
        form.onsubmit = function (ev) {
          ev.preventDefault();
          var payload = [];
          form.querySelectorAll("input[data-line]").forEach(function (input) {
            if (input.value === "") return;
            payload.push({ source_line_id: input.getAttribute("data-line"), received_qty: Number(input.value) });
          });
          var evid = noteInput.value.trim();
          if (!payload.length) {
            msg.textContent = "Enter a quantity that is already on the order. Nothing was invented.";
            return;
          }
          if (!evid) {
            msg.textContent = "A note id or photo id is required. Nothing was recorded.";
            return;
          }
          btn.disabled = true;
          fetch("/api/bzg/uma-blu/goods-receipt", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pr: key, lines: payload, evidence_note_id: evid })
          }).then(function (r) { return r.json(); }).then(function (out) {
            btn.disabled = false;
            if (!out.ok) {
              msg.className = "err";
              msg.textContent = out.error || out.message || "Receive was not recorded.";
              return;
            }
            var receipt = out.receipt || {};
            var stock = out.stock_consequence || {};
            var bill = out.supplier_bill_consequence || {};
            msg.className = "muted";
            msg.textContent = "Recorded " + (receipt.status || "")
              + (receipt.variance_flag ? ". Shortfall noted — not a stock count." : ".")
              + " Stock consequence " + (stock.status || (stock.empty ? "EMPTY" : "updated"))
              + "; bill consequence " + (bill.status || (bill.empty ? "EMPTY" : "updated"))
              + ". Empty stock is not live inventory. Existing record was not rewritten.";
            setTimeout(function () { location.reload(); }, 900);
          }).catch(function () {
            btn.disabled = false;
            msg.className = "err";
            msg.textContent = "Receive was not recorded.";
          });
        };
        act.appendChild(form);
      } else if (actions.receive_waiting && (state === "ORDERED" || state === "PARTIALLY_RECEIVED")) {
        act.appendChild(el("p", "muted", actions.receive_waiting));
      }
      if (actions.pr_operator || actions.correction) {
        var corr = el("div", "panel");
        corr.appendChild(el("h2", null, "Operator note / correction"));
        corr.appendChild(el("p", "muted", "Non-money corrections only. Does not rewrite Alchemist or execute payment."));
        var corrNote = el("input");
        corrNote.placeholder = "Note or correction";
        var corrKind = el("input");
        corrKind.placeholder = "kind: note | correction | quality";
        corrKind.value = "note";
        var corrBtn = el("button", "btn", "Record operator action");
        corrBtn.type = "button";
        var corrMsg = el("p", "muted", "");
        corrBtn.onclick = function () {
          var text = corrNote.value.trim();
          if (!text) {
            corrMsg.className = "err";
            corrMsg.textContent = "A note is required.";
            return;
          }
          corrBtn.disabled = true;
          fetch("/api/bzg/uma-blu/prs/" + encodeURIComponent(key) + "/operator-action", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ kind: (corrKind.value || "note").trim() || "note", note: text })
          }).then(function (r) { return r.json(); }).then(function (out) {
            corrBtn.disabled = false;
            if (!out.ok) {
              corrMsg.className = "err";
              corrMsg.textContent = out.error || out.message || "Not recorded.";
              return;
            }
            corrMsg.className = "muted";
            corrMsg.textContent = "Recorded " + (out.kind || "note") + ". Payment was not executed.";
            corrNote.value = "";
          }).catch(function () {
            corrBtn.disabled = false;
            corrMsg.className = "err";
            corrMsg.textContent = "Not recorded.";
          });
        };
        corr.appendChild(corrKind);
        corr.appendChild(corrNote);
        corr.appendChild(corrBtn);
        corr.appendChild(corrMsg);
        box.appendChild(corr);
      }
      if (actions.close_ops && (state === "RECEIVED" || state === "PARTIALLY_RECEIVED")) {
        var closeNote = el("input");
        closeNote.placeholder = "Close note id or photo id";
        var closeBtn = el("button", "btn", "Close request");
        closeBtn.type = "button";
        closeBtn.onclick = function () {
          if (!closeNote.value.trim()) {
            msg.className = "err";
            msg.textContent = "A note id or photo id is required to close. Payment was not executed.";
            return;
          }
          postAction("/api/bzg/uma-blu/prs/" + encodeURIComponent(key) + "/close", { evidence_note_id: closeNote.value.trim() }, msg, closeBtn);
        };
        act.appendChild(closeNote);
        act.appendChild(closeBtn);
        act.appendChild(el("p", "muted", "Closing here does not pay the supplier."));
      }
      if (!act.contains(msg)) act.appendChild(msg);
      box.appendChild(act);
    })
    .catch(function () {
      document.getElementById("body").textContent = "Could not load this purchase.";
    });
})();
</script>
</body>
</html>
