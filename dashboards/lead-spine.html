<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lead Spine · Beta</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg2: #12151d;
    --bg3: #1a1f2b;
    --border: #2a3142;
    --text: #e8ecf4;
    --muted: #8b95a8;
    --accent: #6ea8ff;
    --ok: #3dd68c;
    --warn: #f5a524;
    --danger: #f04438;
    --font: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); min-height: 100%;
  }
  body { padding: 12px 14px 48px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
  .banner {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 0.9rem; margin-bottom: 14px;
  }
  .banner.demo {
    border-color: rgba(245,165,36,0.45); color: var(--warn);
  }
  .banner .muted { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
  .status-pill {
    display: inline-block; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: 0.78rem; color: var(--muted);
    margin-right: 6px; margin-top: 4px;
  }
  .status-pill.ok { color: var(--ok); border-color: rgba(61,214,140,0.4); }
  .status-pill.wait { color: var(--warn); border-color: rgba(245,165,36,0.45); }
  .status-pill.source {
    color: var(--accent); border-color: rgba(110,168,255,0.45);
  }
  .meta { font-size: 0.78rem; color: var(--muted); margin-top: 6px; word-break: break-word; }
  .meta strong { color: var(--text); font-weight: 600; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--bg3);
    color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 1rem;
    font-weight: 650; cursor: pointer; width: 100%; margin-top: 10px;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #2a5bb8; border-color: #3b6fd0; color: #fff; }
  .btn-ok { background: rgba(61,214,140,0.14); border-color: rgba(61,214,140,0.45); color: var(--ok); }
  .btn-danger { background: rgba(240,68,56,0.14); border-color: rgba(240,68,56,0.45); color: var(--danger); }
  .btn-pair { display: flex; gap: 8px; }
  .btn-pair .btn { flex: 1; }
  .card {
    border: 1px solid var(--border); background: var(--bg2); border-radius: 12px;
    padding: 12px; margin-top: 12px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .card .id { font-size: 0.72rem; color: var(--muted); }
  .err { color: var(--danger); font-size: 0.88rem; margin-top: 10px; white-space: pre-wrap; }
  .okmsg { color: var(--ok); font-size: 0.88rem; margin-top: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: #1c2433; border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 999px; font-size: 0.85rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 16px 4px; }
  label { display: block; font-size: 0.78rem; color: var(--muted); margin: 12px 0 6px; }
  select, textarea, input[type="text"] {
    width: 100%; appearance: none; border: 1px solid var(--border); background: var(--bg3);
    color: var(--text); border-radius: 10px; padding: 12px; font: inherit;
  }
  textarea { min-height: 80px; resize: vertical; line-height: 1.4; }
  .sep {
    margin: 14px 0 8px; font-size: 0.78rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .hidden { display: none; }
  .events { margin-top: 10px; font-size: 0.78rem; color: var(--muted); }
  .events li { margin: 4px 0; }
</style>
</head>
<body>
  <div class="banner demo" id="demoBanner">
    Demo data. Not live leads.
  </div>

  <h1>Lead Spine <span>· Beta</span></h1>
  <p class="sub">Human follow-up for Habitat leads · closed is not a sale and not verified revenue</p>

  <div class="banner" id="whoami">
    <div id="whoLine">Loading identity…</div>
    <div class="muted" id="whoMeta"></div>
  </div>

  <section id="listView">
    <div id="listMsg" class="empty">Loading leads…</div>
    <div id="leadList"></div>
  </section>

  <section id="detailView" class="hidden">
    <button type="button" class="btn" id="btnBack">← Back to list</button>
    <div class="card" style="cursor:default" id="detailCard">
      <h3 id="detTitle">—</h3>
      <div class="id" id="detId"></div>
      <div class="sep">Wolf lifecycle</div>
      <span class="status-pill ok" id="detWolf">—</span>
      <div class="sep">Source stage (as observed)</div>
      <span class="status-pill source" id="detSource">—</span>
      <div class="meta" id="detOwner"></div>
      <div class="meta" id="detConv"></div>
      <div class="meta" id="detResp"></div>
      <div class="meta" id="detClosed"></div>
    </div>

    <label for="noteInput">Note</label>
    <textarea id="noteInput" placeholder="What happened?"></textarea>
    <button type="button" class="btn btn-primary" id="btnNote">Save note</button>

    <label for="stagePick">Wolf lifecycle</label>
    <select id="stagePick">
      <option value="OPEN">Open</option>
      <option value="ACTIVE">Active</option>
      <option value="PARKED">Parked</option>
      <option value="CLOSED">Closed</option>
    </select>
    <button type="button" class="btn" id="btnStage">Update Wolf lifecycle</button>

    <div class="btn-pair">
      <button type="button" class="btn" id="btnTouch">Record touch</button>
      <button type="button" class="btn" id="btnClaim">Claim conversion</button>
    </div>
    <div class="btn-pair">
      <button type="button" class="btn btn-ok" id="btnAssignMe">Assign to me</button>
      <button type="button" class="btn btn-danger" id="btnUnassign">Unassign</button>
    </div>

    <label for="workInput">Link existing work item id</label>
    <input type="text" id="workInput" placeholder="WI-…" />
    <button type="button" class="btn" id="btnWork">Link work item</button>

    <div class="sep">Events</div>
    <ul class="events" id="detEvents"></ul>
    <div id="detMsg"></div>
  </section>

  <div class="toast" id="toast"></div>

<script>
(function () {
  const BRAND = "habitat";
  const state = {
    me: null,
    leads: [],
    selectedId: null,
    detail: null,
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
  );

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }

  function setMsg(el, text, ok) {
    el.className = ok ? "okmsg" : "err";
    el.textContent = text || "";
  }

  async function api(path, opts = {}) {
    const headers = Object.assign({ Accept: "application/json" }, opts.headers || {});
    const init = Object.assign({}, opts);
    if (init.json !== undefined) {
      headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(init.json);
      delete init.json;
    }
    init.headers = headers;
    const res = await fetch(path, init);
    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }
    return { res, data };
  }

  async function loadMe() {
    const { res, data } = await api("/api/core/me");
    if (!res.ok || !data || !data.ok) {
      $("whoLine").textContent = (data && data.message) || "Not signed in.";
      $("whoMeta").textContent = "Lead actions need a verified Person.";
      return null;
    }
    state.me = data;
    const name = data.display_name || data.person_id || "Signed in";
    $("whoLine").textContent = name;
    $("whoMeta").textContent = data.person_id || "";
    return data;
  }

  function renderList() {
    const box = $("leadList");
    const msg = $("listMsg");
    if (!state.leads.length) {
      box.innerHTML = "";
      msg.className = "empty";
      msg.textContent = "No leads for this brand yet.";
      return;
    }
    msg.textContent = "";
    box.innerHTML = state.leads.map((L) => {
      const title = L.demo_label || "Lead";
      const closed = L.wolf_lifecycle === "CLOSED"
        ? `<div class="meta">Closed is not a sale and not verified revenue.</div>`
        : "";
      return `
        <div class="card" data-id="${esc(L.lead_id)}">
          <h3>${esc(title)}</h3>
          <div>
            <span class="status-pill ok">${esc(L.wolf_lifecycle)}</span>
            <span class="status-pill source">Source: ${esc(L.source_stage)}</span>
          </div>
          <div class="meta"><strong>Owner</strong> ${esc(L.owner)}</div>
          <div class="meta"><strong>Conversion</strong> ${esc(L.conversion)}</div>
          <div class="meta"><strong>Response</strong> ${esc(L.response_time)}</div>
          ${closed}
          <div class="id">${esc(L.lead_id)}</div>
        </div>`;
    }).join("");
    box.querySelectorAll(".card").forEach((el) => {
      el.addEventListener("click", () => openDetail(el.getAttribute("data-id")));
    });
  }

  async function loadList() {
    $("listMsg").textContent = "Loading leads…";
    const { res, data } = await api(`/api/leads?brand=${encodeURIComponent(BRAND)}`);
    if (!res.ok) {
      $("leadList").innerHTML = "";
      $("listMsg").className = "err";
      $("listMsg").textContent =
        (data && data.message) || "You do not have permission to view leads for this brand.";
      return;
    }
    state.leads = (data && data.leads) || [];
    if (data && data.empty) {
      $("leadList").innerHTML = "";
      $("listMsg").className = "empty";
      $("listMsg").textContent = data.empty_message || "No leads for this brand yet.";
      return;
    }
    renderList();
  }

  function showList() {
    $("listView").classList.remove("hidden");
    $("detailView").classList.add("hidden");
    state.selectedId = null;
  }

  function showDetail() {
    $("listView").classList.add("hidden");
    $("detailView").classList.remove("hidden");
  }

  function paintDetail() {
    const L = state.detail && state.detail.lead;
    if (!L) return;
    $("detTitle").textContent = L.demo_label || "Lead";
    $("detId").textContent = L.lead_id || "";
    $("detWolf").textContent = L.wolf_lifecycle || "none";
    $("detSource").textContent = L.source_stage || "none";
    $("detOwner").innerHTML = `<strong>Owner</strong> ${esc(L.owner)}`;
    $("detConv").innerHTML = `<strong>Conversion</strong> ${esc(L.conversion)}`;
    $("detResp").innerHTML = `<strong>Response time</strong> ${esc(L.response_time)}`;
    $("detClosed").textContent =
      L.wolf_lifecycle === "CLOSED"
        ? "Closed is not a sale and not verified revenue."
        : "";
    if (L.wolf_lifecycle && L.wolf_lifecycle !== "none") {
      $("stagePick").value = L.wolf_lifecycle;
    }
    const events = (state.detail && state.detail.events) || [];
    $("detEvents").innerHTML = events.length
      ? events.map((e) => `<li>${esc(e.event_type)} · ${esc(e.recorded_at || "")}</li>`).join("")
      : "<li>No events yet.</li>";
  }

  async function openDetail(id) {
    state.selectedId = id;
    const { res, data } = await api(`/api/leads/${encodeURIComponent(id)}`);
    if (!res.ok) {
      toast((data && data.message) || "Could not open lead");
      return;
    }
    state.detail = data;
    paintDetail();
    showDetail();
    setMsg($("detMsg"), "", true);
  }

  async function act(action, json) {
    if (!state.selectedId) return;
    const { res, data } = await api(
      `/api/leads/${encodeURIComponent(state.selectedId)}/${action}`,
      { method: "POST", json: json || {} }
    );
    if (!res.ok) {
      setMsg($("detMsg"), (data && data.message) || "Action failed", false);
      toast((data && data.message) || "Action failed");
      return;
    }
    toast(action + " ok");
    setMsg($("detMsg"), "Saved.", true);
    await openDetail(state.selectedId);
    await loadList();
  }

  $("btnBack").addEventListener("click", () => {
    showList();
    loadList();
  });
  $("btnNote").addEventListener("click", () =>
    act("note", { note: $("noteInput").value })
  );
  $("btnStage").addEventListener("click", () =>
    act("stage", { wolf_stage: $("stagePick").value })
  );
  $("btnTouch").addEventListener("click", () => act("touch", {}));
  $("btnClaim").addEventListener("click", () => act("claim", {}));
  $("btnAssignMe").addEventListener("click", () => {
    if (!state.me || !state.me.person_id) {
      toast("No verified person");
      return;
    }
    act("assign", { owner_person_id: state.me.person_id });
  });
  $("btnUnassign").addEventListener("click", () => act("unassign", {}));
  $("btnWork").addEventListener("click", () =>
    act("work-item", { work_item_id: $("workInput").value.trim() })
  );

  (async function init() {
    await loadMe();
    await loadList();
  })();
})();
</script>
</body>
</html>
