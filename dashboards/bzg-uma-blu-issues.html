<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uma Blu · Issues</title>
<style>
  :root {
    --bg: #0f1c24;
    --bg2: #162833;
    --bg3: #1e3542;
    --line: #2a4554;
    --text: #eef4f7;
    --muted: #8aa0ad;
    --accent: #3db8a0;
    --warn: #e0a045;
    --danger: #e05a4c;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); min-height: 100%;
  }
  body {
    padding: 16px 16px 64px; max-width: 1100px; margin: 0 auto;
    background:
      radial-gradient(ellipse 120% 80% at 10% -10%, #1a3a48 0%, transparent 55%),
      radial-gradient(ellipse 90% 60% at 100% 0%, #163028 0%, transparent 50%),
      var(--bg);
  }
  .brand { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 2px; }
  .brand em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 14px; line-height: 1.35; }
  nav.uma { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  nav.uma a {
    padding: 10px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); text-decoration: none; font-size: 0.84rem; font-weight: 650;
    min-height: 44px; display: inline-flex; align-items: center;
  }
  nav.uma a.active { color: var(--accent); border-color: var(--accent); }
  nav.uma span.disabled { padding: 8px 12px; font-size: 0.78rem; color: var(--muted); opacity: 0.5; }
  .crumb { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .crumb a { color: var(--muted); }
  .row {
    display: block; background: color-mix(in srgb, var(--bg2) 92%, #000);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    margin-bottom: 10px; color: var(--text); text-decoration: none;
  }
  .row:hover { border-color: var(--warn); }
  .row h3 { margin: 0 0 4px; font-size: 1.02rem; }
  .ex { color: var(--warn); font-size: 0.75rem; margin-top: 6px; }
  .kind { color: var(--accent); font-size: 0.78rem; font-weight: 650; }
  .why { color: var(--text); font-size: 0.88rem; margin-top: 6px; line-height: 1.35; }
  .status { color: var(--muted); font-size: 0.75rem; margin-top: 6px; }
  .empty { color: var(--muted); font-size: 0.95rem; padding: 16px 4px; }
  .muted { color: var(--muted); font-size: 0.82rem; }

  /* UX-PACK-03-DESKTOP */
  @media (min-width: 900px) {
    body { max-width: 1100px; padding: 20px 28px 72px; }
    nav.uma { gap: 8px; }
    nav.uma a { flex: 0 0 auto; }
  }
</style>
</head>
<body>
  <p class="crumb"><a href="/bzg">BZG</a> · <a href="/bzg/uma-blu">Uma Blu</a> · Issues</p>
  <h1 class="brand">Uma Blu <em>Issues</em></h1>
  <p class="sub">Write down what went wrong. Quiet when nothing is wrong.</p>

      <nav class="uma" aria-label="Uma Blu desk">
    <a href="/bzg/uma-blu">Today</a>
    <a href="/bzg/uma-blu/bills">Bills</a>
    <a class="active" href="/bzg/uma-blu/issues">Issues</a>
    <a href="/bzg/uma-blu/petty">Petty</a>
    <a href="/bzg/uma-blu/evidence">Evidence</a>
    <a href="/bzg/uma-blu/exceptions">Exceptions</a>
    <a href="/bzg/uma-blu/recipes">Recipes</a>
    <a href="/bzg/uma-blu/real">Real</a>
    <a id="closeLink" href="/uma-blu-close">Close</a>
  </nav>

  <div class="panel" id="issueForm" hidden style="background:#162833;border:1px solid #2a4554;border-radius:14px;padding:14px;margin-bottom:12px">
    <form id="newIssue">
      <label style="display:block;color:#8aa0ad;font-size:0.8rem">What happened
        <textarea id="issueNote" required style="width:100%;min-height:72px;margin-top:4px;border-radius:10px;border:1px solid #2a4554;background:#1e3542;color:#eef4f7;padding:10px;font:inherit"></textarea>
      </label>
      <button type="submit" style="width:100%;min-height:44px;margin-top:8px;border-radius:12px;border:1px solid #2a8a76;background:#1f6b5c;color:#fff;font-weight:650">Open issue</button>
      <p class="muted" id="issueMsg"></p>
    </form>
  </div>
  <div id="list"><p class="muted">Loading…</p></div>

<script>
(function () {
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  fetch("/api/bzg/uma-blu/issues")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var box = document.getElementById("list");
      box.innerHTML = "";
      var rows = data.issues || [];
      var liveIssues = rows.filter(function (it) { return !it.example; });
      var exIssues = rows.filter(function (it) { return it.example; });
      if (!liveIssues.length && !exIssues.length) {
        box.appendChild(el("p", "empty", "No issues. The day is clean."));
        return;
      }
      if (!liveIssues.length) {
        box.appendChild(el("p", "empty", "No live issues. The day is clean."));
      }
      liveIssues.forEach(function (it) {
        var a = el("a", "row");
        a.href = it.href || "#";
        var human = it.classification_label || ({
          NEEDS_MATT: "Needs you",
          NEEDS_STAFF: "Needs staff",
          NEEDS_POLICY: "Needs policy",
          NEEDS_EXTERNAL_ACCESS: "Needs external access"
        })[it.classification] || "Issue";
        a.appendChild(el("div", "kind", human));
        a.appendChild(el("h3", null, it.label || it.why || "Issue"));
        if (it.why) a.appendChild(el("div", "why", it.why));
        var explain = it.explain || {};
        if (explain.decision && explain.decision.summary) {
          a.appendChild(el("div", "why", explain.decision.summary));
        }
        if (it.example) a.appendChild(el("div", "ex", "Practice example — not live"));
        box.appendChild(a);
      });
    })
    .catch(function () {
      document.getElementById("list").textContent = "Could not load issues.";
    });
})();
</script>
<script>
(function () {
  fetch("/api/bzg/uma-blu/permissions").then(function (r) { return r.json(); }).then(function (perm) {
    if (!perm || !perm.buttons || !perm.buttons.create_issue) return;
    var panel = document.getElementById("issueForm");
    panel.hidden = false;
    document.getElementById("newIssue").onsubmit = function (ev) {
      ev.preventDefault();
      var msg = document.getElementById("issueMsg");
      fetch("/api/bzg/uma-blu/issues", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source_kind: "close_exception", note: document.getElementById("issueNote").value })
      }).then(function (r) { return r.json(); }).then(function (out) {
        if (!out.ok) {
          msg.textContent = out.error || out.message || "Issue was not opened.";
          return;
        }
        location.reload();
      }).catch(function () { msg.textContent = "Issue was not opened."; });
    };
  }).catch(function () {});
})();
</script>
</body>
</html>
