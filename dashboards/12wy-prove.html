<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wolf · 12WY prove</title>
<style>
  :root {
    --bg: #101418;
    --bg2: #171d23;
    --line: #2c3842;
    --text: #eef2f5;
    --muted: #8b9aa6;
    --accent: #c4a574;
    --warn: #d4a35c;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background:
      radial-gradient(ellipse 90% 60% at 0% -10%, #243039 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
  h1 { font-family: var(--display); font-weight: 500; font-size: 32px; margin: 0 0 6px; }
  h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px; }
  p { line-height: 1.45; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  .banner {
    border: 1px solid var(--line);
    background: var(--bg2);
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    margin: 12px 0 8px;
  }
  .banner.err { border-left-color: var(--warn); }
  .card {
    border: 1px solid var(--line);
    background: var(--bg2);
    padding: 14px;
    margin: 8px 0;
  }
  .k { color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .v { font-family: var(--display); font-size: 28px; margin: 4px 0; }
  .note { color: var(--muted); font-size: 14px; }
  code { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>12WY prove</h1>
  <p class="lede">CAP-STRAT-01 is already built. This page does not promote it. EMPTY is not 0%. No tactic is invented.</p>
  <div id="banner" class="banner">Reading the prove pack…</div>
  <h2>This week</h2>
  <div id="score" class="card"></div>
  <h2>Bindings</h2>
  <div id="bindings"></div>
</div>
<script>
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function scoreLine(score) {
  const state = score.state || "NOT_READ";
  const percent = score.percent == null ? "no percent" : String(score.percent) + "% evidenced";
  return '<div class="k">weekly score</div><div class="v">' + esc(state) + '</div>' +
    '<p>' + esc(percent) + '. Planned ' + esc(score.planned) + ', done ' + esc(score.done) +
    ', week ' + esc(score.week) + '.</p>' +
    '<p class="note">' + esc(score.why || "") + '</p>' +
    '<p class="note">On-track only at the 85% lock. Auto-NOW is off. RAG is not painted.</p>';
}

function bindLine(row, title) {
  if (!row) return "";
  return '<article class="card"><div class="k">' + esc(title) + '</div>' +
    '<p>' + esc(row.binding || "") + ' · ' + (row.present ? "present" : "not present") + '</p>' +
    '<p class="note">' + esc(row.stated_state || row.score_lock_pct || "") + '</p></article>';
}

fetch("/api/strat/12wy-prove", { headers: { "Accept": "application/json" } })
  .then(function (res) {
    return res.json().then(function (body) { return { status: res.status, body: body }; });
  })
  .then(function (pack) {
    const body = pack.body || {};
    const banner = document.getElementById("banner");
    if (!body.ok) {
      banner.className = "banner err";
      banner.textContent = body.message || body.error || "Read failed. No score was invented.";
      return;
    }
    const h = body.honesty || {};
    const maturity = h.ledger_maturity || "UNKNOWN";
    banner.textContent = "CAP-STRAT-01 ledger " + maturity +
      ". Not promoted. " + (h.cr_id || "") + " " + (h.cr_state || "unread") +
      ". Writes refused.";
    document.getElementById("score").innerHTML = scoreLine(body.score || {});
    document.getElementById("bindings").innerHTML =
      bindLine(body.radar, "Radar") +
      bindLine(body.helm, "Helm pack") +
      '<article class="card"><div class="k">Wolf tasks</div><p class="note">' +
      esc((body.tasks || {}).status || "unread") +
      ". wolf.public was not called.</p></article>";
  })
  .catch(function () {
    const banner = document.getElementById("banner");
    banner.className = "banner err";
    banner.textContent = "Read failed. No score was invented.";
  });
</script>
</body>
</html>
