<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habitat tick → draft · Content</title>
<style>
  :root {
    --bg: #14110c; --bg2: #1e1912; --border: #3d3426;
    --text: #f4efe4; --muted: #b3a48c; --accent: #c4a574; --warn: #e0b15a;
    --font: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 880px; padding: 16px 16px 40px; background: var(--bg); color: var(--text); font-family: var(--font); }
  h1 { font-size: 1.2rem; margin: 0 0 6px; }
  h1 span { color: var(--accent); }
  .note, .meta { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
  .banner { border: 1px solid rgba(224,177,90,0.55); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 0.86rem; }
  button, textarea { font: inherit; }
  textarea { width: 100%; min-height: 72px; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); }
  ul { list-style: none; padding: 0; }
  li { border-top: 1px solid var(--border); padding: 8px 0; font-size: 0.88rem; }
  #detail { white-space: pre-wrap; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body data-wolf-page-type="DASHBOARD" data-wolf-org="CONTENT">
  <p class="note">WOLF · Content · Habitat cycle</p>
  <h1>Habitat <span>tick</span> → draft</h1>
  <p class="banner" id="banner">Loading the cycle…</p>
  <p class="meta" id="why"></p>
  <ul id="list"></ul>
  <h2 class="note">One card</h2>
  <p class="meta" id="picked">No card selected.</p>
  <textarea id="body" placeholder="Comment on the selected card"></textarea>
  <div class="row">
    <button type="button" id="comment">Save comment</button>
    <button type="button" id="apply">Apply comment</button>
    <button type="button" id="tick">Tick</button>
  </div>
  <p class="note">Tick writes a Metricool draft only when that call succeeds. Publish stays off. If the draft call is blocked, the card lands on the Misa queue.</p>
  <div id="detail"></div>
<script>
(function () {
  var API = "/api/content/tick-draft";
  var picked = null;
  function show(obj) { document.getElementById("detail").textContent = JSON.stringify(obj, null, 2); }
  fetch(API, { headers: { Accept: "application/json" } }).then(function (r) { return r.json(); }).then(function (data) {
    var c = data.cycle || {};
    document.getElementById("banner").textContent =
      (c.brand || "") + " " + (c.cycle_start || "") + " → " + (c.cycle_end || "") +
      " · posts " + ((data.counts || {}).posts) + " · stories " + ((data.counts || {}).stories) +
      " · publish " + data.publish + " · staff_ready false";
    document.getElementById("why").textContent = data.why_brand || "";
    var list = document.getElementById("list");
    (data.cards_shown || []).forEach(function (card) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = card.id + " · " + card.date + " · " + (card.title || "(title blank in the file)");
      b.addEventListener("click", function () { picked = card.id; document.getElementById("picked").textContent = b.textContent; });
      li.appendChild(b);
      list.appendChild(li);
    });
  }).catch(function (err) { document.getElementById("banner").textContent = String(err); });
  function post(path, payload) {
    if (!picked) { show({ ok: false, error: "pick a card" }); return; }
    fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(show).catch(function (err) { show(String(err)); });
  }
  document.getElementById("comment").addEventListener("click", function () {
    post("/comment", { card_id: picked, body: document.getElementById("body").value });
  });
  document.getElementById("apply").addEventListener("click", function () { post("/apply", { card_id: picked }); });
  document.getElementById("tick").addEventListener("click", function () { post("/tick", { card_id: picked }); });
})();
</script>
</body>
</html>
