<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reliability — Health Board</title>
  <link rel="stylesheet" href="/wolf-tokens.css" />
  <link rel="stylesheet" href="/assets/wolf-shell.css" />
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c574e;
      --paper: #f3f1ec;
      --card: #fffdf8;
      --line: #ddd6c8;
      --down: #8a1f1f;
      --up: #2a4a28;
      --unk: #6b4a18;
    }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 70% 40% at 100% 0%, #e4ebe6 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 72px; }
    h1 { font-size: 1.65rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 14px; line-height: 1.45; font-size: 0.95rem; }
    .banner {
      background: #f5efe3; border: 1px solid #d2c4a4; border-radius: 10px;
      padding: 12px 14px; margin: 0 0 16px; font-size: 0.9rem; line-height: 1.45;
    }
    .banner strong { color: #5a4a28; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .chip {
      display: inline-block; padding: 5px 10px; border-radius: 6px;
      background: #ebe4d6; font-size: 0.75rem; font-weight: 600;
    }
    .chip.UP { background: #dde8dc; color: var(--up); }
    .chip.DOWN { background: #f5e0e0; color: var(--down); }
    .chip.UNKNOWN { background: #f5ead8; color: var(--unk); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #ebe4d6; vertical-align: top; font-size: 0.86rem; }
    th { background: #f0ebe2; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    tr.DOWN { background: #fff5f3; }
    tr.UP { background: #f6faf6; }
    tr.UNKNOWN { background: #fffaf0; }
    .status { font-weight: 700; white-space: nowrap; }
    .status.UP { color: var(--up); }
    .status.DOWN { color: var(--down); }
    .status.UNKNOWN { color: var(--unk); }
    .muted { color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
    .null { color: #9a9488; font-style: italic; }
    .err { color: var(--down); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
    @media (max-width: 520px) {
      h1 { font-size: 1.35rem; }
      main { padding: 16px 12px 64px; }
      th, td { padding: 8px 8px; font-size: 0.8rem; }
    }
  </style>
</head>
<body data-ready="0" data-pack="RELIABILITY-1">
  <main>
    <h1>Reliability</h1>
    <p class="sub" id="sub">Health board · pack RELIABILITY-1 · loading…</p>
    <div class="banner" id="honesty">
      <strong>Honesty:</strong>
      staff_ready=false · human_commissioned=false ·
      no fake uptime · sidecar DOWN stays DOWN ·
      prod pid 15975 READ-ONLY · write_authority=NONE
    </div>
    <div class="chips" id="chips"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Target</th>
            <th>Port / Pid</th>
            <th>Status</th>
            <th>Uptime %</th>
            <th>Probe</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="muted">Probing listeners…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <script>
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function uptimeCell(v) {
      if (v == null || v === "") return '<span class="null">null (never invent)</span>';
      return esc(v);
    }
    function labelFor(row) {
      const id = row.id || row.role || "";
      if (id === "beta_8788") return "Beta listener";
      if (id === "sidecar_8790") return "Atrium sidecar";
      if (id === "prod_8787") return "Prod (RO)";
      return id || "target";
    }
    function portPid(row) {
      const bits = [];
      if (row.port != null) bits.push(":" + row.port);
      if (row.held_pid != null) bits.push("held pid " + row.held_pid);
      else if (Array.isArray(row.pids) && row.pids.length)
        bits.push("pid " + row.pids.join(","));
      return bits.join(" · ") || "—";
    }
    async function load() {
      const sub = document.getElementById("sub");
      const chips = document.getElementById("chips");
      const rows = document.getElementById("rows");
      try {
        const resp = await fetch("/api/ops/reliability", {
          headers: { Accept: "application/json" }
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          rows.innerHTML = `<tr><td colspan="6" class="err">Failed (${resp.status})</td></tr>`;
          document.body.setAttribute("data-ready", "0");
          sub.textContent = "Health board · pack RELIABILITY-1 · probe failed";
          return;
        }
        sub.textContent =
          "Health board · pack RELIABILITY-1 · as of " +
          (data.as_of_wita || "?") +
          " · ceiling " + (data.ceiling || "BUILT");
        const counts = (data.counts && data.counts.by_status) || {};
        chips.innerHTML = ["UP", "DOWN", "UNKNOWN"].map(function (st) {
          const n = counts[st] || 0;
          return '<span class="chip ' + st + '">' + st + "=" + n + "</span>";
        }).join("") +
          '<span class="chip">fake_uptime=false</span>' +
          '<span class="chip">prod_mutate=false</span>';
        const targets = data.targets || [];
        rows.innerHTML = targets.map(function (row) {
          const st = esc(row.status || "UNKNOWN");
          return (
            '<tr class="' + st + '" data-id="' + esc(row.id) + '" data-status="' + st + '"' +
            ' data-listening="' + (row.listening ? "1" : "0") + '">' +
            "<td><strong>" + esc(labelFor(row)) + "</strong><div class=\"muted\"><code>" +
            esc(row.id) + "</code></div></td>" +
            "<td><code>" + esc(portPid(row)) + "</code></td>" +
            '<td class="status ' + st + '">' + st + "</td>" +
            "<td>" + uptimeCell(row.uptime_pct) + "</td>" +
            "<td class=\"muted\">" + esc(row.probe || "") +
            (row.probe_mode ? " · " + esc(row.probe_mode) : "") + "</td>" +
            "<td class=\"muted\">" + esc(row.notes || "") + "</td>" +
            "</tr>"
          );
        }).join("") || '<tr><td colspan="6" class="muted">No targets</td></tr>';
        document.body.setAttribute("data-ready", "1");
        document.body.setAttribute(
          "data-sidecar",
          ((targets.find(function (t) { return t.id === "sidecar_8790"; }) || {}).status) || ""
        );
      } catch (err) {
        rows.innerHTML = '<tr><td colspan="6" class="err">' + esc(err.message || err) + "</td></tr>";
        document.body.setAttribute("data-ready", "0");
      }
    }
    load();
  </script>
</body>
</html>
