<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atrium finance screens</title>
<style>
  :root {
    --bg: #14110c; --bg2: #1e1912; --border: #3d3426;
    --text: #f4efe4; --muted: #b3a48c; --accent: #c4a574; --warn: #e0b15a;
    --font: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 880px; padding: 16px 16px 48px; background: var(--bg); color: var(--text); font-family: var(--font); }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  h1 span { color: var(--accent); }
  .note { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
  .banner { border: 1px solid rgba(224,177,90,0.55); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 0.86rem; }
  details { border-top: 1px solid var(--border); padding: 8px 0; }
  summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  .why { color: var(--muted); font-size: 0.8rem; white-space: pre-wrap; }
</style>
</head>
<body data-wolf-page-type="DASHBOARD" data-wolf-org="AMG">
  <p class="note">WOLF · Atrium finance · read only</p>
  <h1>Atrium <span>finance</span> screens</h1>
  <p class="banner" id="banner">Loading the books read…</p>
  <p class="note">Xero write is off. Payroll distribution is off. No bank balance is filled in here.</p>
  <div id="list"></div>
<script>
(function () {
  function add(parent, card) {
    var d = document.createElement("details");
    var s = document.createElement("summary");
    s.textContent = card.id + " · " + card.state + " · " + (card.value == null ? "UNKNOWN" : card.value);
    d.appendChild(s);
    var why = document.createElement("p");
    why.className = "why";
    why.textContent = card.why || "";
    d.appendChild(why);
    parent.appendChild(d);
  }
  fetch("/api/amg/finance/screens", { headers: { Accept: "application/json" } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById("banner").textContent =
        "staff_ready false · xero write off · books " + ((data.books || {}).shell_kind || "");
      var list = document.getElementById("list");
      (data.screens || []).forEach(function (card) { add(list, card); });
      (data.withheld || []).forEach(function (card) { add(list, card); });
    })
    .catch(function (err) { document.getElementById("banner").textContent = String(err); });
})();
</script>
</body>
</html>
