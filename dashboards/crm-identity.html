<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wolf · Customer identity</title>
<style>
  :root {
    --bg: #101418;
    --line: #2c3842;
    --text: #eef2f5;
    --muted: #8b9aa6;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --display: "Iowan Old Style", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-family: var(--display); font-weight: 500; font-size: 32px; margin: 0 0 8px; }
  p { line-height: 1.45; color: var(--muted); }
  .card {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-top: 16px;
  }
  code { color: var(--text); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Customer identity</h1>
    <p>CAP-CRM-02 on Beta. A customer is not a lead. Memory notes are append-only. This is not a complete identity graph. People are not merged without evidence. There is no marketing blast.</p>
    <div class="card" id="status">Loading…</div>
  </div>
  <script>
    fetch("/api/crm/identity", { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        var h = (res.body && res.body.honesty) || {};
        var el = document.getElementById("status");
        el.textContent = [
          "HTTP " + res.status,
          "customers " + (res.body.count == null ? "—" : res.body.count),
          "graph complete " + String(res.body.identity_graph_complete === true),
          "ledger " + (h.ledger_maturity || "—"),
          "ceiling " + (h.maturity_ceiling || "—"),
          "CR " + (h.cr_state || "—")
        ].join(" · ");
      })
      .catch(function () {
        document.getElementById("status").textContent = "Customer identity could not be read.";
      });
  </script>
</body>
</html>
