<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Work</title>
<link rel="stylesheet" href="/assets/wolf-truth.css?v=20260927-w3p3" />
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --text: #1c1915; --muted: #5c564c;
    --line: #e4dccf; --accent: #1f4d3a;
    --work-ink: #1c1408; --work-muted: #3f3422; --work-card: #f4e4c4;
    --font: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0 auto; max-width: 720px; padding: 16px 16px 88px;
    background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 17px; line-height: 1.4;
  }
  h1 { font-size: 1.45rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 22px 0 8px; }
  .role, .covers, .boundary, .note { color: var(--muted); margin: 4px 0; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-top: 8px;
  }
  a.action {
    display: block; margin-top: 12px; text-decoration: none;
    background: var(--accent); color: #fff; border-radius: 12px;
    padding: 14px 16px; font-weight: 650; min-height: 48px;
  }
  a.card { display: block; text-decoration: none; color: inherit; }
  a.card:active { border-color: var(--accent); }
  .prompt { margin: 0 0 8px; display: none; } /* MYWORK-1B: title is the only heading */
  #wolf-truth,
  #wolf-truth .wolf-card,
  #wolf-truth .wolf-empty,
  #wolf-truth h2,
  #wolf-truth h3,
  #wolf-truth p,
  #wolf-truth .wolf-state {
    color: #1c1915 !important;
    background-color: #fffdf8 !important;
  }
  #wolf-truth .wolf-card,
  #wolf-truth .wolf-empty {
    border: 1px solid #8a8175 !important;
  }
  #sections a.action,
  #sections a.card,
  #sections .work-card {
    background: #f4e4c4 !important;
    color: #1c1408 !important;
    border: 1px solid #8a5a12;
  }
  #sections a.action p,
  #sections a.card p,
  #sections .work-card p,
  #sections .work-title,
  #sections .next {
    color: #1c1408 !important;
  }
  #sections a.action .footnote,
  #sections a.card .footnote,
  #sections .footnote,
  #sections .meta {
    color: #3f3422 !important;
    font-size: 0.78rem;
    margin-top: 6px;
  }
  .work-title { font-weight: 700; margin: 0 0 4px; }
  .next { font-weight: 650; margin: 8px 0 0; }
  .err { color: #8d1d1d; }
  @media (max-width: 420px) {
    body { padding: 12px 12px 88px; font-size: 16px; }
  }
</style>
<style>
  html, body { overflow-x: hidden !important; max-width: 100%; }
  #wolf-boards, #wolfnav, #wolfnav-scrim { max-width: 100vw !important; }
</style>
</head>
<body data-wolf-page-type="WORKSPACE" data-wolf-shell="global">
  <h1 id="hello">My Work</h1>
  <div id="wolf-truth" data-wolf-truth data-surface="my-work"></div>
  <p class="role" id="role"></p>
  <p class="covers" id="covers"></p>
  <p class="boundary" id="boundary"></p>
  <div id="msg"></div>
  <div id="sections"></div>
  <p class="note" id="notes"></p>
  <div id="desk"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  function cards(items) {
    return (items || []).map((it) => {
      const title = `<p class="work-title">${esc(it.title || it.what || "")}</p>`;
      const range = it.date_range ? `<p>${esc(it.date_range)}</p>` : "";
      const status = it.status_label || it.status;
      const state = status ? `<p>${esc(status)}</p>` : "";
      const metaBits = [
        it.requested_by ? `Requested by ${it.requested_by}` : "",
        it.current_owner ? `Owner ${it.current_owner}` : "",
        it.due ? `Due ${it.due}` : "",
        it.company_site_department || "",
        it.priority != null ? `Priority ${it.priority}` : "",
        it.evidence_required ? `Evidence: ${it.evidence_required}` : "",
        it.evidence_files ? `${it.evidence_files} file(s) attached` : ""
      ].filter(Boolean);
      const meta = metaBits.length
        ? `<p class="meta">${esc(metaBits.join(" · "))}</p>`
        : "";
      const next = (it.next_step || it.what_happens_next)
        ? `<p class="next">${esc(it.next_step || it.what_happens_next)}</p>`
        : "";
      const foot = it.staff_footnote
        ? `<p class="footnote">${esc(it.staff_footnote)}</p>`
        : "";
      const inner = `${title}${range}${state}${meta}${next}${foot}`;
      if (it.href) {
        return `<a class="action work-card" href="${esc(it.href)}">${inner}</a>`;
      }
      return `<div class="card work-card">${inner}</div>`;
    }).join("");
  }

  function part(block) {
    const items = block.items || [];
    const body = items.length
      ? cards(items)
      : `<div class="wolf-empty">${esc(block.empty_message || "Nothing here.")}</div>`;
    const prompt = block.prompt ? `<p class="prompt">${esc(block.prompt)}</p>` : "";
    return `${prompt}${body}`;
  }

  function framework(sections) {
    return (sections || []).filter((block) => block && block.show !== false).map((block) => {
      const body = (block.parts && block.parts.length)
        ? block.parts.map(part).join("")
        : part(block);
      const score = block.performance && block.performance.shown_as_score === false
        ? `<p class="wolf-empty" data-performance="${esc(block.performance.state || "MISSING")}">${esc(block.performance.message || "")}</p>`
        : "";
      return `<section data-section="${esc(block.key || "")}"><h2>${esc(block.title || "")}</h2>${body}${score}</section>`;
    }).join("");
  }

  function list(block) {
    if (!block) return "";
    return `<section data-section="${esc(block.key || "")}"><h2>${esc(block.title || "")}</h2>${part(block)}</section>`;
  }

  fetch("/api/staff/home", { headers: { Accept: "application/json" } })
    .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      if (!ok || data.ok === false) {
        $("hello").textContent = "My Work";
        $("msg").innerHTML = `<p class="err">${esc(data.message || "This page did not load.")}</p>`;
        return;
      }
      $("hello").textContent = data.greeting || "My Work";
      const role = (data.role || {}).label || "";
      $("role").textContent = role;
      const covers = data.covers || [];
      $("covers").textContent = covers.length ? covers.join(", ") : "";
      $("boundary").textContent = data.boundary || "";
      const dash = data.dashboard || {};
      if (dash.sections && dash.sections.length) {
        $("sections").innerHTML = framework(dash.sections);
        document.body.setAttribute("data-dashboard", "1");
        if (dash.representative) document.body.setAttribute("data-representative", String(dash.representative));
      } else {
        $("sections").innerHTML = (data.sections || []).map(list).join("");
      }
      const notes = data.notifications || {};
      $("notes").textContent = notes.empty_message || "";
      const deskLinks = (dash.sections && dash.sections.length) ? [] : (data.desk || []);
      const extra = [{ label: "Execution report", href: "/execution-report" }];
      $("desk").innerHTML = [...deskLinks, ...extra].map((link) => (
        `<a class="action" href="${esc(link.href)}">${esc(link.label)}</a>`
      )).join("");
      const over = document.documentElement.scrollWidth > document.documentElement.clientWidth + 1;
      document.body.setAttribute("data-overflow", over ? "yes" : "no");
      document.body.setAttribute("data-ready", "1");
    })
    .catch((err) => {
      $("msg").innerHTML = `<p class="err">${esc(err.message || "This page did not load.")}</p>`;
    });
})();
</script>
<script src="/assets/wolf-truth.js?v=20260927-w3p4"></script>
</body>
</html>
