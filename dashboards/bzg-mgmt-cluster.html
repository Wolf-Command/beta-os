<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BZG Management Cluster · Beta</title>
<style>
  :root {
    --bg: #12161c;
    --bg2: #1a2129;
    --bg3: #24303a;
    --line: #314049;
    --text: #eef2f5;
    --muted: #8b9aa6;
    --accent: #c4a574;
    --warn: #d4a574;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background:
      radial-gradient(ellipse 80% 50% at 100% 0%, #2a353f 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 16px 14px 88px; }
  h1 {
    font-family: var(--display); font-weight: 500; font-size: 1.55rem;
    margin: 0 0 4px; letter-spacing: -0.01em;
  }
  h1 span { color: var(--accent); }
  .lede { color: var(--muted); font-size: 0.88rem; line-height: 1.4; margin: 0 0 12px; }
  h2 {
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 8px;
  }
  .banner {
    border: 1px solid var(--line); background: var(--bg2);
    border-left: 3px solid var(--accent); padding: 10px 12px;
    font-size: 0.88rem; margin: 8px 0;
  }
  .banner.warn { border-left-color: var(--warn); color: var(--warn); }
  .card {
    border: 1px solid var(--line); background: var(--bg2);
    padding: 12px; margin: 0 0 8px;
  }
  .k { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .title { font-family: var(--display); font-size: 1.15rem; margin: 4px 0 6px; }
  .note { color: var(--muted); font-size: 0.84rem; line-height: 1.4; margin: 0; }
  .pill {
    display: inline-block; border: 1px solid var(--line); padding: 2px 8px;
    font-size: 0.72rem; color: var(--muted); margin: 0 4px 4px 0;
  }
  .pill.loud { color: var(--warn); border-color: rgba(212,165,116,0.55); }
  .next {
    display: block; margin-top: 10px; padding: 10px 12px;
    border: 1px solid #4a5a48; background: #1e2a22; color: var(--text);
    text-decoration: none; font-weight: 600; font-size: 0.9rem;
  }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(18,22,28,0.94); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    backdrop-filter: blur(8px);
  }
  .nav a {
    color: var(--muted); text-decoration: none; font-size: 0.72rem;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 8px;
  }
  .err { color: #e07070; font-size: 0.88rem; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BZG Management <span>· Cluster</span></h1>
  <p class="lede">Bound beta-bzg-loop-safe. Composes existing P&amp;L, variance, allocation, BOM, POS observe, and reputation modules. Empty stays empty — no invented numbers. Not proven. Not ready.</p>
  <div class="banner warn" id="who">Loading…</div>
  <div id="msg"></div>

  <h2 id="now">Now</h2>
  <div id="nowBox"></div>

  <h2 id="modules">Modules</h2>
  <div id="mods"></div>

  <h2 id="handoff">Owner / Empire handoff</h2>
  <div id="hand"></div>
</div>
<nav class="nav" id="nav" aria-label="Cluster"></nav>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  async function api(path) {
    const res = await fetch(path, { headers: { Accept: "application/json" } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      const err = new Error(data.message || data.error || ("HTTP " + res.status));
      err.payload = data;
      throw err;
    }
    return data;
  }

  function pills(tags) {
    return (tags || []).map((t) =>
      `<span class="pill loud">${esc(t)}</span>`
    ).join(" ");
  }

  function render(desk) {
    const sr = desk.staff_ready || {};
    $("who").textContent = (sr.who_line || "Signed in")
      + " · empty modules " + (desk.empty_count ?? "?")
      + " · proven=false · ready=false · money=null";

    const next = desk.primary_next || sr.primary_next || {};
    $("nowBox").innerHTML = `<div class="card">
      <div class="k">Primary next</div>
      <div class="title">${esc(next.label || "No further action")}</div>
      <p class="note">Derived from live module state. Not invented.</p>
      ${next.href ? `<a class="next" href="${esc(next.href)}">${esc(next.label)}</a>` : ""}
    </div>`;

    $("mods").innerHTML = (desk.modules || []).map((m) => {
      const strip = m.honesty_strip || {};
      const tags = strip.status_tags || [strip.status || "EMPTY"];
      const nxt = m.primary_next || strip.next_action || {};
      return `<article class="card" id="mod-${esc(m.id)}">
        <div class="k">${esc(m.staff_title || m.title)}</div>
        <div class="title">${esc(m.staff_title || m.title)}</div>
        <div>${pills(tags)}</div>
        <p class="note">${esc(strip.message || "")}</p>
        <p class="note">Numbers: none · invented=false</p>
        ${nxt.href ? `<a class="next" href="${esc(nxt.href)}">${esc(nxt.label || "Open")}</a>` : ""}
      </article>`;
    }).join("");

    const hand = desk.owner_empire_handoff || {};
    $("hand").innerHTML = `<div class="card">
      <div>${pills([hand.founder_dep_class || "AUGMENT"])}</div>
      <p class="note">${esc(hand.label || hand.founder_dep_reason || "")}</p>
      <p class="note">Routing label only — Owner controls not invented away.</p>
    </div>`;

    const nav = desk.nav || sr.nav || [];
    $("nav").innerHTML = nav.map((n) =>
      `<a href="${esc(n.href)}">${esc(n.label)}</a>`
    ).join("");
  }

  api("/api/bzg/mgmt-cluster").then(render).catch((err) => {
    $("who").textContent = "Denied or unavailable";
    $("msg").innerHTML = `<p class="err">${esc(err.message || err)}</p>`;
  });
})();
</script>
</body>
</html>
