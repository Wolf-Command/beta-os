<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Uma Blu · Tonight's Close</title>
<style>
  :root {
    --bg: #0b1220; --card: #121a2b; --line: #243049; --text: #f4f7fb;
    --muted: #9aa7bd; --accent: #3d8bfd; --ok: #2ecc71; --warn: #f0b429; --bad: #e85d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); padding: 12px 14px 96px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 1.35rem; margin: 0 0 2px; }
  .sub { color: #9aa7bd; margin: 0 0 14px; font-size: 0.92rem; }
  .when { font-weight: 700; margin: 0 0 16px; font-size: 1.05rem; }
  .msg { min-height: 1.2em; margin: 0 0 10px; color: #9aa7bd; font-size: 0.9rem; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin: 0 0 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 1.02rem; letter-spacing: 0.02em; }
  .kicker { color: #9aa7bd; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(36,48,73,0.65); font-size: 0.95rem; }
  .line:last-child { border-bottom: 0; }
  .line .lbl { color: #9aa7bd; }
  .line .val { font-weight: 650; text-align: right; }
  .btn {
    display: block; width: 100%; margin: 8px 0 0; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: #1a2438; color: var(--text);
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-ok { background: var(--ok); border-color: var(--ok); color: #06210f; }
  .btn-warn { background: var(--warn); border-color: var(--warn); color: #1a1400; }
  .btn-huge { padding: 18px 16px; font-size: 1.15rem; margin-top: 12px; }
  .btn:disabled { opacity: 0.45; }
  .hidden { display: none !important; }
  .ok-pill { display: inline-block; background: rgba(46,204,113,0.15); color: var(--ok); padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
  .warn-box { background: rgba(240,180,41,0.12); border: 1px solid rgba(240,180,41,0.4); color: #ffe6a3; padding: 10px 12px; border-radius: 10px; margin: 8px 0; }
  .bank { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; }
  .bank h3 { margin: 0 0 8px; font-size: 1rem; }
  input[type=number], textarea, input[type=text] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #0d1524; color: var(--text); font-size: 1rem; margin: 6px 0 8px;
  }
  .lbl { display: block; color: #9aa7bd; font-size: 0.82rem; margin-top: 6px; }
  img.preview { max-width: 100%; border-radius: 10px; margin: 8px 0; display: none; }
  img.preview.show { display: block; }
  .choose-list button { text-align: left; }
  .done-banner { text-align: center; padding: 28px 12px; }
  .done-banner .big { font-size: 1.6rem; color: var(--ok); font-weight: 800; margin: 8px 0; }
</style>
</head>
<body>
  <h1>Uma Blu</h1>
  <p class="sub" id="pageSub">Tonight's Close</p>
  <p class="when" id="whenLabel"></p>
  <p class="msg" id="msg"></p>

  <!-- CHOOSE -->
  <section id="secChoose" class="card">
    <h2>Open close</h2>
    <div id="chooseList" class="choose-list"></div>
    <button class="btn" id="btnRefreshDates" type="button">Refresh</button>
  </section>

  <!-- ONE PAGE CLOSE -->
  <section id="secClose" class="hidden">

    <!-- 1 ESB -->
    <div class="card" id="cardEsb">
      <p class="kicker">1 · Shift report</p>
      <h2>ESB</h2>
      <div id="esbStatus"></div>
      <img class="preview" id="shiftPreview" alt="Shift report" />
      <div class="photo-actions" id="shiftPhotoActions">
        <button class="btn btn-primary" id="btnTakeShift" type="button">TAKE PHOTO</button>
        <button class="btn" id="btnUploadShift" type="button">UPLOAD PHOTO</button>
      </div>
      <input type="file" id="shiftCam" accept="image/*,image/heic,image/heif,.heic,.heif" capture="environment" hidden />
      <input type="file" id="shiftFile" accept="image/*,image/heic,image/heif,.heic,.heif" hidden />
      <button class="btn btn-primary hidden" id="btnReadShift" type="button">Read shift report</button>
      <div id="esbFigures" class="hidden"></div>
      <div id="esbActions" class="hidden">
        <button class="btn btn-ok" id="btnShiftCorrect" type="button">CORRECT</button>
        <button class="btn" id="btnShiftEdit" type="button">VIEW / CORRECT</button>
      </div>
      <div id="esbEditPanel" class="hidden"></div>
      <p class="msg hidden" id="shiftSaveFail">PHOTO COULD NOT BE SAVED — try again</p>
    </div>

    <!-- 2 BANKS -->
    <div class="card" id="cardBanks">
      <p class="kicker">2 · Bank receipts</p>
      <h2>Bank receipts</h2>
      <div id="bankCards"><p class="sub">Confirm the shift report first.</p></div>
      <input type="file" id="bankFile" accept="image/*,image/heic,image/heif,.heic,.heif" capture="environment" hidden />
    </div>

    <!-- 3 CASH -->
    <div class="card" id="cardCash">
      <p class="kicker">3 · Cash</p>
      <h2>Cash count</h2>
      <div id="cashLines"></div>
      <label class="lbl" for="cashAmt">I COUNTED</label>
      <input type="number" id="cashAmt" min="0" step="1000" placeholder="Amount counted" />
      <button class="btn" id="btnCashPhoto" type="button">TAKE CASH PHOTO (optional)</button>
      <input type="file" id="cashFile" accept="image/*" capture="environment" hidden />
      <div id="cashDiff"></div>
      <label class="lbl hidden" for="cashWhy" id="cashWhyLabel">WHY?</label>
      <textarea id="cashWhy" class="hidden" rows="2" placeholder="Simple note"></textarea>
      <button class="btn btn-primary" id="btnCashSave" type="button">SAVE COUNT</button>
    </div>

    <!-- 4 FINISH -->
    <div class="card" id="cardFinish">
      <p class="kicker">4 · Finish</p>
      <h2>Finish close</h2>
      <div id="finishSummary"></div>
      <button class="btn btn-primary btn-huge" id="btnFinish" type="button">FINISH CLOSE</button>
      <button class="btn btn-warn btn-huge hidden" id="btnFinishEx" type="button">FINISH WITH EXCEPTION</button>
    </div>
  </section>

  <section id="secDone" class="card hidden">
    <div class="done-banner">
      <div class="ok-pill">✓ COMPLETE</div>
      <div class="big" id="doneTitle">CLOSE SAVED</div>
      <p id="doneBody" class="sub"></p>
      <button class="btn" id="btnBackHome" type="button">Back</button>
    </div>
  </section>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let close = null;
  let wizard = null;
  let selectedDate = "";
  let shiftRef = "", shiftHash = "", shiftExtract = {};
  let bankRef = "", bankHash = "", bankDraft = null, activeBank = "";
  let cashRef = "", cashHash = "";
  let lastCashSaved = null;

  function money(n) {
    if (n == null || n === "" || Number.isNaN(Number(n))) return "—";
    return "Rp" + Number(n).toLocaleString("id-ID");
  }
  function longDate(iso) {
    if (!iso) return "";
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d, 4));
    return dt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Makassar" });
  }
  function setMsg(text, ok) {
    const el = $("msg");
    el.textContent = text || "";
    el.className = "msg" + (ok === true ? " ok" : ok === false ? " bad" : "");
  }
  function line(label, val) {
    return `<div class="line"><span class="lbl">${label}</span><span class="val">${val}</span></div>`;
  }
  async function api(path, opts) {
    const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json", Accept: "application/json" } }, opts || {}));
    const text = await r.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_e) { data = { raw: text }; }
    if (!r.ok || data.ok === false) {
      const msg = (data && (data.staff_message || data.message || data.error)) || ("Request failed (" + r.status + ")");
      const err = new Error(String(msg).replace(/VDC-[a-f0-9-]+/gi, "this close").replace(/PERS-[A-Z0-9-]+/gi, "staff"));
      throw err;
    }
    return data;
  }
  async function postPhoto(file, kind) {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("kind", kind || "esb");
    if (close && close.close_id) fd.append("close_id", close.close_id);
    if (selectedDate) fd.append("business_date", selectedDate);
    const r = await fetch("/api/venue-close/receipt-photo", { method: "POST", body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || data.ok === false) throw new Error("PHOTO COULD NOT BE SAVED — try again");
    if (data.close_id) close = { close_id: data.close_id, business_date: selectedDate || data.business_date };
    return data;
  }

  async function loadQueue() {
    const data = await api("/api/venue-close/history-queue");
    const rows = data.rows || data.items || data.queue || [];
    const list = $("chooseList");
    if (!rows.length) {
      list.innerHTML = `<button class="btn btn-primary" id="btnStartToday" type="button">START TONIGHT'S CLOSE</button>`;
      $("btnStartToday").onclick = () => openTonight();
      return;
    }
    list.innerHTML = rows.slice(0, 12).map((row) => {
      const iso = row.business_date || row.date;
      const label = row.staff_label || row.action_label || row.state || "OPEN";
      const action = (row.action || row.primary_action || "OPEN").toUpperCase();
      return `<button class="btn" type="button" data-iso="${iso}" data-action="${action}">${longDate(iso)} · ${label}</button>`;
    }).join("") + `<button class="btn btn-primary" id="btnStartToday" type="button">TONIGHT</button>`;
    list.querySelectorAll("[data-iso]").forEach((b) => {
      b.onclick = () => openDate(b.getAttribute("data-iso"), b.getAttribute("data-action"));
    });
    const t = $("btnStartToday");
    if (t) t.onclick = () => openTonight();
  }

  function todayWITA() {
    const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Makassar", year: "numeric", month: "2-digit", day: "2-digit" });
    return fmt.format(new Date());
  }

  async function openTonight() {
    await openDate(todayWITA(), "START");
  }

  async function openDate(iso, action) {
    selectedDate = iso;
    $("whenLabel").textContent = longDate(iso);
    $("pageSub").textContent = "Tonight's Close";
    setMsg("Opening…", true);
    const peek = await api("/api/venue-close/date-peek?business_date=" + encodeURIComponent(iso));
    if (peek.close_id) {
      close = { close_id: peek.close_id, business_date: iso, state: peek.state };
    } else if ((action || "").includes("CONTINUE") && peek.close_id) {
      close = { close_id: peek.close_id, business_date: iso };
    } else {
      const opened = await api("/api/venue-close/open", {
        method: "POST",
        body: JSON.stringify({ business_date: iso, outlet_id: "BZG-UMA" }),
      });
      close = { close_id: opened.close_id, business_date: iso, state: opened.state };
    }
    await loadWizard();
    $("secChoose").classList.add("hidden");
    $("secClose").classList.remove("hidden");
    $("secDone").classList.add("hidden");
    await silentAckDiff();
    renderAll();
    setMsg("", true);
  }

  async function ensureClose() {
    if (close && close.close_id) return;
    await openDate(selectedDate || todayWITA(), "START");
  }

  async function loadWizard() {
    if (!close || !close.close_id) return;
    wizard = await api("/api/venue-close/" + encodeURIComponent(close.close_id) + "/source-wizard");
    const ev = (wizard.shift_report_evidence || {}).reports || [];
    const confirmed = ev.filter((r) => r.human_confirm_status === "CONFIRMED" || r.human_confirm_status === "EDITED");
    const latest = confirmed[confirmed.length - 1] || ev[ev.length - 1];
    if (latest) {
      shiftRef = latest.image_object_ref || shiftRef;
      shiftHash = latest.content_hash || shiftHash;
    }
    const p = wizard.printed_source || {};
    if (p.image_object_ref) shiftRef = p.image_object_ref;
    if (p.content_hash) shiftHash = p.content_hash;
  }

  async function silentAckDiff() {
    try {
      const d = (wizard && wizard.source_discrepancy) || {};
      if (d.has_discrepancy && !(wizard && wizard.esb_difference_acked) && close && close.close_id) {
        await api("/api/venue-close/ack-esb-difference", {
          method: "POST",
          body: JSON.stringify({ close_id: close.close_id }),
        });
        await loadWizard();
      }
    } catch (_e) { /* Wolf handles underneath — never block captain */ }
  }

  function phone() {
    return (wizard && wizard.phone_close) || {};
  }

  function renderAll() {
    renderEsb();
    renderBanks();
    renderCash();
    renderFinish();
  }

  function renderEsb() {
    const ph = phone();
    const printed = (wizard && wizard.printed_source) || {};
    const shiftYes = wizard && wizard.shift_figures_yes;
    const status = $("esbStatus");
    const figs = $("esbFigures");
    const actions = $("esbActions");
    if (shiftYes || ph.shift_read) {
      status.innerHTML = `<span class="ok-pill">✓ SHIFT REPORT READ</span>`;
      $("shiftPhotoActions").classList.add("hidden");
      $("btnReadShift").classList.add("hidden");
      figs.classList.remove("hidden");
      figs.innerHTML =
        line("Sales", money(ph.sales != null ? ph.sales : printed.gross_sales_rp)) +
        line("Bills", ph.bills != null ? ph.bills : (printed.bills != null ? printed.bills : "—")) +
        line("Pax", ph.pax != null ? ph.pax : (printed.pax != null ? printed.pax : "—")) +
        line("Cash", money(ph.cash != null ? ph.cash : printed.cash_rp)) +
        line("Card", money(ph.card)) +
        line("QRIS", money(ph.qris)) +
        line("Other", money(ph.other));
      actions.classList.remove("hidden");
      $("btnShiftCorrect").classList.add("hidden");
      $("btnShiftEdit").textContent = "VIEW / CORRECT";
    } else if (shiftRef || printed.image_attached) {
      status.innerHTML = `<p class="sub">Photo ready — read the report</p>`;
      $("btnReadShift").classList.remove("hidden");
      figs.classList.add("hidden");
      actions.classList.add("hidden");
    } else {
      status.innerHTML = `<p class="sub">Take a photo of the final shift report</p>`;
      $("shiftPhotoActions").classList.remove("hidden");
      $("btnReadShift").classList.add("hidden");
      figs.classList.add("hidden");
      actions.classList.add("hidden");
    }
  }

  function showShiftEdit() {
    const ph = phone();
    const p = (wizard && wizard.printed_source) || {};
    const panel = $("esbEditPanel");
    panel.classList.remove("hidden");
    panel.innerHTML =
      `<p class="sub">Type the figures from the report.</p>` +
      `<label class="lbl">Sales</label><input type="number" id="editGross" value="${ph.sales || p.gross_sales_rp || ""}" />` +
      `<label class="lbl">Bills</label><input type="number" id="editBills" value="${ph.bills != null ? ph.bills : (p.bills != null ? p.bills : "")}" />` +
      `<label class="lbl">Pax</label><input type="number" id="editPax" value="${ph.pax != null ? ph.pax : (p.pax != null ? p.pax : "")}" />` +
      `<label class="lbl">Cash</label><input type="number" id="editCash" value="${ph.cash || p.cash_rp || ""}" />` +
      `<label class="lbl">BNI Card</label><input type="number" id="editBniEdc" value="${p.edc_bni_rp || ""}" />` +
      `<label class="lbl">BNI QRIS</label><input type="number" id="editBniQris" value="${p.qris_bni_rp || ""}" />` +
      `<label class="lbl">BRI Card</label><input type="number" id="editBriEdc" value="${p.edc_bri_rp || ""}" />` +
      `<label class="lbl">BRI QRIS</label><input type="number" id="editBriQris" value="${p.qris_bri_rp || ""}" />` +
      `<label class="lbl">Mandiri Card</label><input type="number" id="editManEdc" value="${p.edc_mandiri_rp || ""}" />` +
      `<label class="lbl">Mandiri QRIS</label><input type="number" id="editManQris" value="${p.qris_mandiri_rp || ""}" />` +
      `<button class="btn btn-primary" id="btnSaveEdit" type="button">SAVE</button>` +
      `<button class="btn" id="btnCancelEdit" type="button">CANCEL</button>`;
    $("btnSaveEdit").onclick = () => saveShiftEdit().catch((e) => setMsg(e.message, false));
    $("btnCancelEdit").onclick = () => { panel.classList.add("hidden"); panel.innerHTML = ""; };
  }

  async function saveShiftEdit() {
    await ensureClose();
    const figures = {
      gross_sales_rp: Number($("editGross").value) || null,
      bills: $("editBills").value ? Number($("editBills").value) : null,
      pax: $("editPax").value ? Number($("editPax").value) : null,
      cash_rp: Number($("editCash").value) || null,
      edc_bni_rp: Number($("editBniEdc").value) || null,
      qris_bni_rp: Number($("editBniQris").value) || null,
      edc_bri_rp: Number($("editBriEdc").value) || null,
      qris_bri_rp: Number($("editBriQris").value) || null,
      edc_mandiri_rp: Number($("editManEdc").value) || null,
      qris_mandiri_rp: Number($("editManQris").value) || null,
    };
    if (!figures.gross_sales_rp || !figures.cash_rp) {
      setMsg("Enter at least sales and cash from the report.", false);
      return;
    }
    setMsg("Saving…", true);
    await api("/api/venue-close/save-shift-figure-edits", {
      method: "POST",
      body: JSON.stringify({ close_id: close.close_id, object_ref: shiftRef, content_hash: shiftHash, extracted: shiftExtract, figures }),
    });
    shiftExtract = Object.assign({}, shiftExtract, figures);
    await api("/api/venue-close/confirm-shift-figures", {
      method: "POST",
      body: JSON.stringify({ close_id: close.close_id, object_ref: shiftRef, content_hash: shiftHash, extracted: figures }),
    });
    await loadWizard();
    await silentAckDiff();
    $("esbEditPanel").classList.add("hidden");
    renderAll();
    setMsg("Figures saved.", true);
  }

  async function readShiftReport() {
    await ensureClose();
    setMsg("Reading…", true);
    const extracted = await api("/api/venue-close/esb-receipt-extract", {
      method: "POST",
      body: JSON.stringify({ close_id: close.close_id, object_ref: shiftRef, content_hash: shiftHash }),
    });
    shiftExtract = extracted.extracted || extracted.document || {};
    await loadWizard();
    const printed = (wizard && wizard.printed_source) || {};
    const readable = (shiftExtract.gross_sales_rp || shiftExtract.gross_amount || printed.gross_sales_rp) &&
      (shiftExtract.cash_rp || shiftExtract.cash_amount || printed.cash_rp) != null;
    $("esbFigures").classList.remove("hidden");
    $("esbActions").classList.remove("hidden");
    $("btnShiftCorrect").classList.remove("hidden");
    $("esbStatus").innerHTML = readable
      ? `<span class="ok-pill">✓ FIGURES READY</span>`
      : `<div class="warn-box">Nothing read — tap VIEW / CORRECT and type the figures</div>`;
    const src = Object.assign({}, printed, shiftExtract);
    $("esbFigures").innerHTML =
      line("Sales", money(src.gross_sales_rp || src.gross_amount)) +
      line("Bills", src.bills != null ? src.bills : "—") +
      line("Pax", src.pax != null ? src.pax : "—") +
      line("Cash", money(src.cash_rp || src.cash_amount)) +
      line("BNI Card", money(src.edc_bni_rp)) +
      line("BNI QRIS", money(src.qris_bni_rp)) +
      line("BRI Card", money(src.edc_bri_rp)) +
      line("BRI QRIS", money(src.qris_bri_rp));
    setMsg(readable ? "Do these figures match the report?" : "Nothing read — tap VIEW / CORRECT.", readable);
  }

  async function confirmShiftYes() {
    await ensureClose();
    const printed = (wizard && wizard.printed_source) || {};
    const src = Object.assign({}, printed, shiftExtract);
    const flat = {
      gross_sales_rp: src.gross_sales_rp || src.gross_amount,
      bills: src.bills,
      pax: src.pax,
      cash_rp: src.cash_rp || src.cash_amount,
      edc_bni_rp: src.edc_bni_rp,
      qris_bni_rp: src.qris_bni_rp,
      edc_bri_rp: src.edc_bri_rp,
      qris_bri_rp: src.qris_bri_rp,
      edc_mandiri_rp: src.edc_mandiri_rp,
      qris_mandiri_rp: src.qris_mandiri_rp,
    };
    if (!flat.gross_sales_rp || flat.cash_rp == null) {
      setMsg("Nothing read — tap VIEW / CORRECT and type the figures.", false);
      return;
    }
    setMsg("Saving…", true);
    await api("/api/venue-close/confirm-shift-figures", {
      method: "POST",
      body: JSON.stringify({ close_id: close.close_id, object_ref: shiftRef, content_hash: shiftHash, extracted: flat }),
    });
    await loadWizard();
    await silentAckDiff();
    renderAll();
    setMsg("Shift report confirmed.", true);
  }

  function renderBanks() {
    const cards = ((wizard && wizard.wizard_bank_cards) || {}).cards || [];
    const root = $("bankCards");
    if (!(wizard && wizard.shift_figures_yes) && !(phone().shift_read)) {
      root.innerHTML = `<p class="sub">Confirm the shift report first.</p>`;
      return;
    }
    if (!cards.length) {
      root.innerHTML = `<p class="sub">No bank receipts needed for this close.</p>`;
      return;
    }
    root.innerHTML = cards.map((c) => {
      if (c.status === "UNCERTAIN" || c.status === "FIGURES_NEED_EDIT") {
        return `<div class="bank">
          <div class="warn-box">WE COULDN'T READ THIS PAYMENT${c.bank ? " · " + c.bank : ""}</div>
          <button class="btn btn-warn" type="button" data-check="1">CHECK</button>
        </div>`;
      }
      let body = line("Expected Card", money(c.expected_edc)) + line("Expected QRIS", money(c.expected_qris));
      if (c.receipt_added) {
        body += line("Receipt Card", money(c.actual_edc)) + line("Receipt QRIS", money(c.actual_qris));
        body += `<span class="ok-pill">${c.staff_label || "SAVED"}</span>`;
      }
      const act = c.receipt_added ? "" :
        `<button class="btn btn-primary" type="button" data-bank="${c.bank}" data-action="add">TAKE RECEIPT PHOTO</button>
         <div id="bankWork-${c.bank}"></div>`;
      return `<div class="bank" id="bankCard-${c.bank}"><h3>${c.bank}</h3>${body}${act}</div>`;
    }).join("");
    root.querySelectorAll("[data-action='add']").forEach((b) => {
      b.onclick = () => {
        activeBank = b.getAttribute("data-bank");
        $("bankFile").value = "";
        $("bankFile").click();
      };
    });
    root.querySelectorAll("[data-check]").forEach((b) => {
      b.onclick = () => showShiftEdit();
    });
  }

  function showBankWork(bank, expEdc, expQris) {
    const work = $("bankWork-" + bank);
    if (!work) return;
    let actEdc = bankDraft && (bankDraft.edc_card_amount != null ? bankDraft.edc_card_amount : bankDraft.TOTAL_EDC);
    let actQris = bankDraft && (bankDraft.qris_amount != null ? bankDraft.qris_amount : bankDraft.TOTAL_QRIS);
    const failed = (actEdc == null || actEdc === 0) && (actQris == null || actQris === 0);
    work.innerHTML =
      (failed ? `<div class="warn-box">Couldn't read — type the amount from the receipt</div>` : "") +
      line("Expected Card", money(expEdc)) + line("Receipt Card", money(actEdc)) +
      line("Expected QRIS", money(expQris)) + line("Receipt QRIS", money(actQris)) +
      `<button class="btn btn-ok" id="btnBankOk-${bank}" type="button">CORRECT</button>` +
      `<button class="btn" id="btnBankEdit-${bank}" type="button">EDIT</button>`;
    $(`btnBankOk-${bank}`).onclick = () => confirmBank().catch((e) => setMsg(e.message, false));
    $(`btnBankEdit-${bank}`).onclick = () => {
      work.innerHTML =
        `<label class="lbl">Card amount</label><input type="number" id="editEdc-${bank}" value="${actEdc || ""}" />` +
        `<label class="lbl">QRIS amount</label><input type="number" id="editQris-${bank}" value="${actQris || ""}" />` +
        `<button class="btn btn-primary" id="btnBankSave-${bank}" type="button">SAVE</button>`;
      $(`btnBankSave-${bank}`).onclick = () => {
        bankDraft = bankDraft || {};
        bankDraft.edc_card_amount = Number($(`editEdc-${bank}`).value) || 0;
        bankDraft.qris_amount = Number($(`editQris-${bank}`).value) || 0;
        showBankWork(bank, expEdc, expQris);
      };
    };
  }

  async function uploadBank(file) {
    try {
      const data = await postPhoto(file, "edc");
      bankRef = data.object_ref;
      bankHash = data.content_hash;
      const card = (((wizard || {}).wizard_bank_cards || {}).cards || []).find((c) => c.bank === activeBank) || {};
      bankDraft = await api("/api/venue-close/edc-receipt-extract", {
        method: "POST",
        body: JSON.stringify({
          close_id: close.close_id,
          object_ref: bankRef,
          content_hash: bankHash,
          bank_hint: activeBank,
          esb_edc_expected: card.expected_edc,
          esb_qris_expected: card.expected_qris,
        }),
      });
      renderBanks();
      showBankWork(activeBank, card.expected_edc, card.expected_qris);
      setMsg("Receipt linked — confirm amounts.", true);
    } catch (_e) {
      setMsg("PHOTO COULD NOT BE SAVED — try again", false);
    }
  }

  async function confirmBank() {
    const card = (((wizard || {}).wizard_bank_cards || {}).cards || []).find((c) => c.bank === activeBank) || {};
    const edc = bankDraft.edc_card_amount != null ? bankDraft.edc_card_amount : bankDraft.TOTAL_EDC;
    const qris = bankDraft.qris_amount != null ? bankDraft.qris_amount : bankDraft.TOTAL_QRIS;
    await api("/api/venue-close/edc-receipt", {
      method: "POST",
      body: JSON.stringify({
        close_id: close.close_id,
        object_ref: bankRef,
        content_hash: bankHash,
        acquirer_label: activeBank,
        edc_card_amount: edc,
        qris_amount: qris,
        action: "looks_correct",
      }),
    });
    await loadWizard();
    renderAll();
    setMsg(activeBank + " receipt saved.", true);
  }

  function renderCash() {
    const c = (wizard && wizard.wizard_cash) || {};
    const petty = (wizard && wizard.wizard_petty) || phone().petty || {};
    $("cashLines").innerHTML =
      line("Expected after petty", money(c.expected_cash_in_till)) +
      line("Shift report cash", money(c.shift_report_cash)) +
      line("Petty out", money(c.petty_cash_paid_today != null ? c.petty_cash_paid_today : petty.out)) +
      line("Petty in", money(c.petty_cash_in_today != null ? c.petty_cash_in_today : petty.in));
    if (c.cash_counted != null && $("cashAmt").value === "") $("cashAmt").value = c.cash_counted;
    updateCashDiff();
  }

  function updateCashDiff() {
    const c = (wizard && wizard.wizard_cash) || {};
    const counted = $("cashAmt").value === "" ? null : Number($("cashAmt").value);
    const expected = c.expected_cash_in_till;
    const box = $("cashDiff");
    if (counted == null || expected == null) {
      box.innerHTML = "";
      $("cashWhyLabel").classList.add("hidden");
      $("cashWhy").classList.add("hidden");
      return;
    }
    const diff = Math.round((counted - expected) * 100) / 100;
    if (Math.abs(diff) < 0.01) {
      box.innerHTML = `<span class="ok-pill">MATCHES</span>`;
      $("cashWhyLabel").classList.add("hidden");
      $("cashWhy").classList.add("hidden");
    } else {
      const label = diff < 0 ? "DIFFERENCE · short " + money(Math.abs(diff)) : "DIFFERENCE · over " + money(diff);
      box.innerHTML = `<div class="warn-box">${label}</div>`;
      $("cashWhyLabel").classList.remove("hidden");
      $("cashWhy").classList.remove("hidden");
    }
  }

  async function saveCash() {
    await ensureClose();
    const amt = Number($("cashAmt").value);
    if (!amt && amt !== 0) { setMsg("Enter the counted cash.", false); return; }
    await api("/api/venue-close/till-declare", {
      method: "POST",
      body: JSON.stringify({
        close_id: close.close_id,
        amount: amt,
        cash_why_note: ($("cashWhy").value || "").trim() || null,
        object_ref: cashRef || null,
        content_hash: cashHash || null,
      }),
    });
    lastCashSaved = amt;
    await loadWizard();
    renderAll();
    setMsg("Cash count saved.", true);
  }

  function renderFinish() {
    const ph = phone();
    const c = (wizard && wizard.wizard_cash) || {};
    const banks = ((wizard && wizard.wizard_bank_cards) || {}).cards || [];
    const ready = (wizard && wizard.submit_readiness) || {};
    const needBanks = banks.some((b) => b.status === "RECEIPT_REQUIRED" || b.status === "UNCERTAIN");
    const hasCash = c.cash_counted != null || ($("cashAmt").value !== "" && !Number.isNaN(Number($("cashAmt").value)));
    $("finishSummary").innerHTML =
      line("Sales", money(ph.sales)) +
      line("Cash expected", money(c.expected_cash_in_till)) +
      line("Cash counted", money(c.cash_counted != null ? c.cash_counted : ($("cashAmt").value || null))) +
      line("Banks left", needBanks ? banks.filter((b) => b.status === "RECEIPT_REQUIRED" || b.status === "UNCERTAIN").map((b) => b.bank || "CHECK").join(", ") : "None") +
      (c.difference != null && Math.abs(c.difference) >= 0.01 ? `<div class="warn-box">${c.difference_label || "Cash difference"} ${money(Math.abs(c.difference))}</div>` : "");
    const canFinish = Boolean(ph.shift_read || (wizard && wizard.shift_figures_yes)) && hasCash && !needBanks;
    $("btnFinish").disabled = !canFinish && !ready.submit_enabled;
    const hasEx = Boolean(ready.has_exception || (c.difference != null && Math.abs(c.difference) >= 0.01));
    $("btnFinishEx").classList.toggle("hidden", !hasEx);
    $("btnFinishEx").disabled = !canFinish && !ready.submit_with_exception_available && !ready.submit_enabled;
    // Variance never blocks — enable finish when shift+cash done even if banks uncertain? Owner: banks needing evidence must be shown; allow finish with exception if mismatch.
    if ((ph.shift_read || (wizard && wizard.shift_figures_yes)) && hasCash) {
      $("btnFinish").disabled = needBanks;
      $("btnFinishEx").disabled = needBanks;
      if (hasEx) $("btnFinishEx").classList.remove("hidden");
    }
  }

  async function doFinish(withException) {
    await ensureClose();
    const amt = Number($("cashAmt").value);
    if ($("cashAmt").value !== "" && amt !== lastCashSaved) {
      await saveCash();
    }
    setMsg("Saving close…", true);
    const out = await api("/api/venue-close/staff-submit", {
      method: "POST",
      body: JSON.stringify({
        close_id: close.close_id,
        amount: Number($("cashAmt").value),
        cash_why_note: ($("cashWhy").value || "").trim() || null,
        submit_with_exception: !!withException,
      }),
    });
    $("secClose").classList.add("hidden");
    $("secDone").classList.remove("hidden");
    $("doneTitle").textContent = out.staff_message || out.message || (withException ? "CLOSE SAVED WITH EXCEPTION" : "CLOSE SAVED");
    $("doneBody").textContent = "✓ COMPLETE";
    setMsg("", true);
  }

  // Wire events
  $("btnRefreshDates").onclick = () => loadQueue().catch((e) => setMsg(e.message, false));
  $("btnTakeShift").onclick = () => $("shiftCam").click();
  $("btnUploadShift").onclick = () => $("shiftFile").click();
  $("shiftCam").onchange = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    try {
      $("shiftSaveFail").classList.add("hidden");
      const data = await postPhoto(f, "esb");
      shiftRef = data.object_ref; shiftHash = data.content_hash;
      const preview = $("shiftPreview");
      preview.src = URL.createObjectURL(f); preview.classList.add("show");
      await loadWizard(); renderEsb();
      setMsg("Photo uploaded.", true);
    } catch (_e) {
      $("shiftSaveFail").classList.remove("hidden");
      setMsg("PHOTO COULD NOT BE SAVED — try again", false);
    }
  };
  $("shiftFile").onchange = $("shiftCam").onchange;
  $("btnReadShift").onclick = () => readShiftReport().catch((e) => setMsg(e.message, false));
  $("btnShiftCorrect").onclick = () => confirmShiftYes().catch((e) => setMsg(e.message, false));
  $("btnShiftEdit").onclick = () => showShiftEdit();
  $("bankFile").onchange = (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (f) uploadBank(f);
  };
  $("cashAmt").oninput = () => { updateCashDiff(); renderFinish(); };
  $("btnCashSave").onclick = () => saveCash().catch((e) => setMsg(e.message, false));
  $("btnCashPhoto").onclick = () => $("cashFile").click();
  $("cashFile").onchange = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    try {
      const data = await postPhoto(f, "till");
      cashRef = data.object_ref; cashHash = data.content_hash;
      setMsg("Cash photo saved.", true);
    } catch (_e) { setMsg("PHOTO COULD NOT BE SAVED — try again", false); }
  };
  $("btnFinish").onclick = () => doFinish(false).catch((e) => setMsg(e.message, false));
  $("btnFinishEx").onclick = () => doFinish(true).catch((e) => setMsg(e.message, false));
  $("btnBackHome").onclick = () => {
    $("secDone").classList.add("hidden");
    $("secClose").classList.add("hidden");
    $("secChoose").classList.remove("hidden");
    close = null; wizard = null;
    loadQueue().catch(() => {});
  };

  loadQueue().catch((e) => setMsg(e.message, false));
})();
</script>
</body>
</html>
