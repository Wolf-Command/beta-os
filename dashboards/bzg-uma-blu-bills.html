<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uma Blu · PR and bills</title>
<style>
  :root {
    --bg: #0f1c24;
    --bg2: #162833;
    --bg3: #1e3542;
    --line: #2a4554;
    --text: #eef4f7;
    --muted: #8aa0ad;
    --accent: #3db8a0;
    --warn: #e0a045;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); min-height: 100%;
  }
  body {
    padding: 16px 16px 64px; max-width: 480px; margin: 0 auto;
    overflow-x: clip;
    background:
      radial-gradient(ellipse 120% 80% at 10% -10%, #1a3a48 0%, transparent 55%),
      radial-gradient(ellipse 90% 60% at 100% 0%, #163028 0%, transparent 50%),
      var(--bg);
  }
  .brand { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 2px; }
  .brand em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 14px; line-height: 1.35; }
  .banner {
    background: rgba(224,160,69,0.12); border: 1px solid rgba(224,160,69,0.45);
    color: var(--warn); border-radius: 12px; padding: 10px 12px;
    font-size: 0.88rem; margin-bottom: 14px;
  }
  .banner.hidden { display: none; }
  nav.uma { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  nav.uma a {
    padding: 10px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); text-decoration: none; font-size: 0.84rem; font-weight: 650;
    min-height: 44px; display: inline-flex; align-items: center;
  }
  nav.uma a.active { color: var(--accent); border-color: var(--accent); }
  nav.uma span.disabled { padding: 8px 12px; font-size: 0.78rem; color: var(--muted); opacity: 0.5; }
  .crumb { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .crumb a { color: var(--muted); }
  a.row, .row {
    display: block; color: inherit; text-decoration: none;
    background: color-mix(in srgb, var(--bg2) 92%, #000);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px;
  }
  .row h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .state {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 0.75rem; color: var(--muted); margin-bottom: 8px;
  }
  .state.warn { color: var(--warn); border-color: rgba(224,160,69,0.45); }
  .chip {
    display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid rgba(61,184,160,0.45); color: var(--accent);
    font-size: 0.72rem; font-weight: 650; vertical-align: middle;
  }
  .meta { color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
  .id { font-size: 0.72rem; color: var(--muted); margin-top: 8px; word-break: break-all; }
  .ex { color: var(--warn); font-size: 0.75rem; margin-top: 6px; }
  .muted { color: var(--muted); font-size: 0.82rem; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 8px 0; }
</style>
</head>
<body>
  <p class="crumb"><a href="/bzg">BZG</a> · <a href="/bzg/uma-blu">Uma Blu</a> · PR and bills</p>
  <h1 class="brand">PR <em>and bills</em></h1>
  <p class="sub">Request is not approval. A paid claim is not a verified payment.</p>

    <nav class="uma" aria-label="Uma Blu day">
    <a href="/bzg/uma-blu">Today</a>
    <a href="/uma-blu-close">Daily Close</a>
    <a href="/bzg/uma-blu/issues">Issues</a>
    <a class="active" href="/bzg/uma-blu/bills">Bills</a>
    <a href="/bzg/uma-blu/bills#purchasing">Purchasing</a>
    <a href="/bzg/uma-blu/evidence">Evidence</a>
    <a href="/bzg/uma-blu/exceptions">Exceptions</a>
    <a href="/my-work">My Work</a>
    <a href="/bzg/uma-blu/petty">Petty cash</a>
  </nav>

  <div class="panel" id="createPanel" hidden>
    <h2 style="margin:0 0 8px;font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)">New request</h2>
    <form id="createForm">
      <label>Supplier<input id="supplier" required /></label>
      <label>What it is for<input id="purpose" required /></label>
      <label>Item<input id="item" required /></label>
      <label>Quantity<input id="qty" type="number" min="0" step="any" required /></label>
      <button class="btn" type="submit">Save draft</button>
      <p class="muted" id="createMsg"></p>
    </form>
  </div>
  <style>
    label { display:block; font-size:0.8rem; color:var(--muted); margin:8px 0 4px; }
    input { width:100%; border:1px solid var(--line); background:var(--bg3); color:var(--text); border-radius:10px; padding:12px; font:inherit; }
    .btn { appearance:none; width:100%; min-height:44px; margin-top:10px; border-radius:12px; border:1px solid #2a8a76; background:#1f6b5c; color:#fff; font-size:1rem; font-weight:650; }
    .panel { background: color-mix(in srgb, var(--bg2) 92%, #000); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  </style>

  <div id="purchasing"></div>
  <div id="list"><p class="muted">Loading…</p></div>

<script>
(function () {
  var STATE_LABEL = {
    REQUESTED: "Waiting approval",
    APPROVED: "Approved",
    ORDERED: "Ordered",
    RECEIVED: "Received",
    BILL_RECEIVED: "Bill received",
    PAYMENT_REQUESTED: "Payment requested",
    PAYMENT_APPROVED: "Payment approved",
    PAID_CLAIMED: "Paid claimed — not verified",
    PAYMENT_VERIFIED: "Payment verified",
    CLOSED: "Closed",
    POLICY_REQUIRED: "Policy required",
    REJECTED: "Rejected",
    DRAFT: "Draft — not submitted",
    PARTIALLY_RECEIVED: "Part received",
    OPS_CLOSED: "Closed for operations — payment not executed"
  };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  fetch("/api/bzg/uma-blu/prs")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var box = document.getElementById("list");
      box.innerHTML = "";
      var rows = data.prs || [];
      var liveRows = rows.filter(function (p) { return !p.example; });
      if (!liveRows.length) {
        box.appendChild(el("p", "empty", "No purchase requests yet."));
        document.body.setAttribute("data-ready", "1");
        document.body.setAttribute("data-overflow", document.documentElement.scrollWidth > document.documentElement.clientWidth + 1 ? "yes" : "no");
        return;
      }
      liveRows.forEach(function (p) {
        var key = p.pr_num || p.pr_id;
        var d = key ? el("a", "row") : el("div", "row");
        if (key) d.href = "/bzg/uma-blu/bills/" + encodeURIComponent(key);
        var st = p.state || "";
        var label = p.display_status || STATE_LABEL[st] || st;
        var warn = st === "POLICY_REQUIRED" || st === "PAID_CLAIMED" || p.alchemist_status === "Awaiting Devi";
        var head = el("div");
        head.appendChild(el("span", "state" + (warn ? " warn" : ""), label));
        if (p.legacy) head.appendChild(el("span", "chip", "Existing"));
        d.appendChild(head);
        var title = (p.supplier_name || "Purchase request");
        if (p.purpose) title += " · " + p.purpose;
        d.appendChild(el("h3", null, title));
        var bits = [];
        if (p.pr_num && !/^\d+$/.test(String(p.pr_num))) bits.push(String(p.pr_num));
        if (p.requester_label) bits.push("Requested by " + p.requester_label);
        if (p.expected_value != null) {
          var amt = String(p.expected_value);
          if (p.currency) amt += " " + p.currency;
          bits.push(amt);
        } else if (p.currency) {
          bits.push(p.currency);
        }
        if (p.bill_reference) bits.push("Bill " + p.bill_reference);
        if (bits.length) d.appendChild(el("div", "meta", bits.join(" · ")));
        box.appendChild(d);
      });
      document.body.setAttribute("data-ready", "1");
      document.body.setAttribute("data-overflow", document.documentElement.scrollWidth > document.documentElement.clientWidth + 1 ? "yes" : "no");
    })
    .catch(function () {
      document.getElementById("list").textContent = "Could not load bills.";
      document.body.setAttribute("data-ready", "1");
    });
})();
</script>
<script>
(function () {
  var panel = document.getElementById("createPanel");
  if (!panel) return;
  fetch("/api/bzg/uma-blu/permissions").then(function (r) { return r.json(); }).then(function (perm) {
    var buttons = (perm && perm.buttons) || {};
    if (!buttons.create_pr) return;
    panel.hidden = false;
    document.getElementById("createForm").onsubmit = function (ev) {
      ev.preventDefault();
      var msg = document.getElementById("createMsg");
      fetch("/api/bzg/uma-blu/prs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          supplier_name: document.getElementById("supplier").value,
          purpose: document.getElementById("purpose").value,
          submitted: false,
          lines: [{ item: document.getElementById("item").value, qty: Number(document.getElementById("qty").value) }]
        })
      }).then(function (r) { return r.json(); }).then(function (out) {
        if (!out.ok) {
          msg.textContent = out.error || out.message || "Draft was not saved.";
          return;
        }
        location.href = "/bzg/uma-blu/bills/" + encodeURIComponent(out.pr.pr_id);
      }).catch(function () {
        msg.textContent = "Draft was not saved.";
      });
    };
  }).catch(function () {});
})();
</script>
</body>
</html>
