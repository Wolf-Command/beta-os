<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uma Blu · Exceptions</title>
<style>
  :root {
    --bg: #0f1c24; --bg2: #162833; --line: #2a4554; --text: #eef4f7;
    --muted: #8aa0ad; --accent: #3db8a0;
    --font: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); min-height: 100%;
  }
  body {
    padding: 16px 16px 64px; max-width: 480px; margin: 0 auto;
    overflow-wrap: anywhere; overflow-x: clip;
  }
  .brand { font-size: 1.45rem; font-weight: 700; margin: 0 0 2px; }
  .brand em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 14px; line-height: 1.35; }
  nav.uma { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  nav.uma a {
    padding: 10px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); text-decoration: none; font-size: 0.84rem; font-weight: 650;
    min-height: 44px; display: inline-flex; align-items: center;
  }
  nav.uma a.active { color: var(--accent); border-color: var(--accent); }
  .card {
    display: block; background: color-mix(in srgb, var(--bg2) 92%, #000);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px;
    color: var(--text); text-decoration: none;
  }
  .empty { color: var(--muted); font-size: 0.95rem; }
  .act {
    display: flex; align-items: center; justify-content: center;
    margin-top: 10px; min-height: 44px; border-radius: 12px;
    background: #1f6b5c; color: #fff; text-decoration: none; font-weight: 650;
  }
</style>
</head>
<body data-wolf-page-type="WORKSPACE" data-wolf-org="BZG/UMA" data-wolf-shell="global">
  <h1 class="brand">Uma Blu <em>Exceptions</em></h1>
  <p class="sub">A till that does not match ESB shows here after the close is marked as an exception. Empty means nothing is open.</p>
  <nav class="uma" aria-label="Uma Blu day">
    <a href="/bzg/uma-blu">Today</a>
    <a href="/uma-blu-close">Daily Close</a>
    <a href="/bzg/uma-blu/issues">Issues</a>
    <a href="/bzg/uma-blu/bills">Bills</a>
    <a href="/bzg/uma-blu/bills#purchasing">Purchasing</a>
    <a href="/bzg/uma-blu/evidence">Evidence</a>
    <a class="active" href="/bzg/uma-blu/exceptions">Exceptions</a>
    <a href="/my-work">My Work</a>
    <a href="/bzg/uma-blu/petty">Petty cash</a>
  </nav>
  <div id="list"><p class="empty">Loading…</p></div>
<script>
(function () {
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  fetch("/api/bzg/uma-blu/exceptions")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var box = document.getElementById("list");
      box.innerHTML = "";
      var rows = data.exceptions || [];
      if (!rows.length) {
        box.appendChild(el("p", "empty", data.why || "No exceptions open."));
      } else {
        rows.forEach(function (row) {
          var card = el("div", "card");
          card.appendChild(el("div", null, row.label || row.why || "Exception"));
          if (row.why && row.why !== row.label) card.appendChild(el("p", "empty", row.why));
          var href = row.work_href || row.href || "/my-work";
          var a = el("a", "act", row.work_href ? "Open in My Work" : "Open");
          a.href = href;
          card.appendChild(a);
          box.appendChild(card);
        });
      }
      document.body.setAttribute("data-ready", "1");
      var over = document.documentElement.scrollWidth > document.documentElement.clientWidth + 1;
      document.body.setAttribute("data-overflow", over ? "yes" : "no");
    })
    .catch(function () {
      document.getElementById("list").textContent = "Could not load exceptions.";
    });
})();
</script>
</body>
</html>
